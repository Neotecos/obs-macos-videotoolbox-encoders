SettingsWindow.RealTime.Summary="Кодерҙы ысын ваҡыт менән бер тигеҙ тота, тотороҡло түбән кисегеүҙе өҫтөн итеп."
SettingsWindow.RealTime.Tooltip="VideoToolbox-ҡа һәр кадр өсөн өҫтәмә ваҡыт һарыф итеү урынына килеүсе кадр йышлығына тап килергә ҡуша. Быны Twitch, Amazon IVS һәм Dolby OptiView/Millicast Multitrack Video өсөн көтә. Һүндерелгәндә ул OBS-тың үҙ аппарат кодеры кеүек эшләй, ул бер аҙ яҡшыраҡ сифат бирә ала. Кәңәш: тере эфир өсөн ҡабыҙылған, урындағы яҙма өсөн һүндерелгән."
SettingsWindow.PrioritizeSpeed="Кодлау тиҙлеген сифаттан өҫтөн ҡуйырға"
SettingsWindow.PrioritizeSpeed.Summary="Ауыр йөкләмә аҫтында сифатты өҫтәмә кодлау тиҙлегенә алмаштыра."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-дың аппарат кодерҙары, RealTime ҡабыҙылған булһа ла, ғәҙәттә сифатҡа өҫтөнлөк бирә. Быны тик һайланған сифатта, бит йышлығында йәки кадр йышлығында кадрҙар юғалғанда йәки кисектерелгәндә генә ҡабыҙығыҙ. Күпселек көйләүҙәрҙә был кәрәкмәй."
SettingsWindow.Lookahead="Үҙ көйләнгән алдан ҡарау кадр һаны"
SettingsWindow.Lookahead.Summary="Кодер ҡыҫыуҙан алда нисә киләһе кадрҙы өйрәнәсәген билдәләй."
SettingsWindow.Lookahead.Tooltip="Юғарыраҡ ҡиммәт RealTime режимында юғалған сифаттың бер өлөшөн ҡайтарырға булышлыҡ итә ала, әммә бер аҙ күберәк кисегеү һәм хәтер талап итә. Түбәнерәк ҡиммәт кисегеүҙе тарыраҡ тота. Кодер үҙе автомат рәүештә хәл итһен өсөн һүндерелгән көйө ҡалдырығыҙ, OBS-тың үҙ кодеры кеүек."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) йәки яңыраҡ талап ителә. Был системала мөмкин түгел."
SettingsWindow.Multitrack="Multitrack Video өсөн был кодерҙарҙы ҡулланырға"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS һәм Dolby OptiView Multitrack Video өсөн был кодерҙарҙы автомат рәүештә алмаштыра."
SettingsWindow.Multitrack.Tooltip="OBS, эфир башланыр алдынан, һәр Multitrack Video трегы өсөн стандарт Apple аппарат кодерын юғарыла көйләнгән кодерға алмаштыра. Алмаштырыу мөмкин булмаһа, OBS тыныс ҡына иҫке кодерҙы һаҡлай — эфир был сәбәпле бер ҡасан да туҡтатылмай."
