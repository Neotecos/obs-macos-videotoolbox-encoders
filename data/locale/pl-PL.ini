SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Utrzymuje koder w rytmie czasu rzeczywistego, faworyzując stabilne niskie opóźnienie."
SettingsWindow.RealTime.Tooltip="Nakazuje VideoToolbox dotrzymywać kroku wejściowej liczbie klatek zamiast poświęcać dodatkowy czas na każdą klatkę. Tego właśnie oczekują Twitch, Amazon IVS i Dolby OptiView/Millicast w przypadku wideo wieloscieżkowego. Po wyłączeniu zachowuje się jak natywny sprzętowy koder OBS, który może osiągnąć nieco lepszą jakość na bit. Zalecane: włączone przy transmisji na żywo, wyłączone przy lokalnym nagrywaniu."
SettingsWindow.PrioritizeSpeed="Priorytet szybkości kodowania nad jakością"
SettingsWindow.PrioritizeSpeed.Summary="Zamienia część jakości na dodatkową szybkość kodowania przy dużym obciążeniu."
SettingsWindow.PrioritizeSpeed.Tooltip="Sprzętowe kodery Apple domyślnie preferują jakość, nawet przy włączonym RealTime. Włącz to tylko wtedy, gdy widzisz gubione lub opóźnione klatki przy wybranej rozdzielczości, przepływności lub liczbie klatek. Większość konfiguracji nigdy tego nie potrzebuje."
SettingsWindow.Lookahead="Niestandardowa liczba klatek analizy wyprzedzającej"
SettingsWindow.Lookahead.Summary="Określa, ile nadchodzących klatek koder analizuje przed kompresją."
SettingsWindow.Lookahead.Tooltip="Wyższa wartość może odzyskać część jakości utraconej z powodu trybu RealTime, kosztem nieco większego opóźnienia i pamięci. Niższa wartość utrzymuje opóźnienie ściślejsze. Pozostaw wyłączone, aby koder decydował automatycznie, tak jak natywny koder OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Wymaga macOS 15 (Sequoia) lub nowszego. Niedostępne w tym systemie."
SettingsWindow.Multitrack="Użyj tych koderów dla wideo wieloscieżkowego"
SettingsWindow.Multitrack.Summary="Automatycznie zastępuje tymi koderami wideo wieloscieżkowe Twitch, Amazon IVS i Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS zastępuje standardowy sprzętowy koder Apple tym skonfigurowanym powyżej dla każdej ścieżki wideo wieloscieżkowego tuż przed rozpoczęciem transmisji. Jeśli zamiana nie jest możliwa, OBS po cichu zachowuje oryginalny koder — transmisja nigdy nie jest przez to blokowana."
