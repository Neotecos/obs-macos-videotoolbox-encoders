SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="인코더를 실시간에 맞춰 유지하여 안정적인 저지연을 우선합니다."
SettingsWindow.RealTime.Tooltip="각 프레임에 추가 시간을 쓰는 대신 들어오는 프레임 속도에 맞추도록 VideoToolbox에 지시합니다. 이는 Twitch, Amazon IVS, Dolby OptiView/Millicast가 멀티트랙 비디오에 기대하는 동작입니다. 끄면 OBS의 기본 하드웨어 인코더처럼 동작하여 비트당 약간 더 나은 품질을 얻을 수 있습니다. 권장: 라이브 스트리밍에는 켜고, 로컬 녹화에는 끄세요."
SettingsWindow.PrioritizeSpeed="품질보다 인코딩 속도 우선"
SettingsWindow.PrioritizeSpeed.Summary="높은 부하 상태에서 일부 품질을 추가 인코딩 속도와 교환합니다."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple의 하드웨어 인코더는 RealTime이 켜져 있어도 기본적으로 품질을 우선합니다. 선택한 해상도, 비트레이트 또는 프레임 속도에서 프레임 누락이나 지연이 보일 때만 이 옵션을 켜세요. 대부분의 설정에서는 필요하지 않습니다."
SettingsWindow.Lookahead="사용자 지정 룩어헤드 프레임 수"
SettingsWindow.Lookahead.Summary="압축 전에 인코더가 검토할 향후 프레임 수를 설정합니다."
SettingsWindow.Lookahead.Tooltip="값을 높이면 RealTime 모드로 인한 품질 손실 일부를 회복할 수 있지만, 지연 시간과 메모리 사용량이 약간 늘어납니다. 값을 낮추면 지연 시간을 더 좁게 유지합니다. OBS의 기본 인코더처럼 인코더가 자동으로 결정하도록 끄로 두세요."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15(Sequoia) 이상이 필요합니다. 이 시스템에서는 사용할 수 없습니다."
SettingsWindow.Multitrack="멀티트랙 비디오에 이 인코더 사용"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS, Dolby OptiView 멀티트랙 비디오에 이 인코더로 자동 교체합니다."
SettingsWindow.Multitrack.Tooltip="스트리밍이 시작되기 직전에 OBS는 각 멀티트랙 비디오 트랙의 표준 Apple 하드웨어 인코더를 위에서 구성한 인코더로 교체합니다. 교체가 불가능하면 OBS는 조용히 원래 인코더를 유지합니다 — 이로 인해 스트리밍이 차단되는 일은 없습니다."
