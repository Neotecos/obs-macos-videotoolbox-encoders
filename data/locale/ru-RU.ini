SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Удерживает кодировщик в такт с реальным временем, отдавая предпочтение стабильно низкой задержке."
SettingsWindow.RealTime.Tooltip="Указывает VideoToolbox придерживаться входящей частоты кадров вместо того, чтобы тратить дополнительное время на каждый кадр. Именно этого ожидают Twitch, Amazon IVS и Dolby OptiView/Millicast для многодорожечного видео. При отключении ведёт себя как встроенный аппаратный кодировщик OBS, который может достичь чуть лучшего качества на бит. Рекомендуется: включено для прямых трансляций, выключено для локальной записи."
SettingsWindow.PrioritizeSpeed="Приоритет скорости кодирования над качеством"
SettingsWindow.PrioritizeSpeed.Summary="Меняет часть качества на дополнительную скорость кодирования при высокой нагрузке."
SettingsWindow.PrioritizeSpeed.Tooltip="Аппаратные кодировщики Apple по умолчанию отдают предпочтение качеству, даже при включённом RealTime. Включайте это только если замечаете потерянные или задержанные кадры при выбранном разрешении, битрейте или частоте кадров. Большинству настроек это никогда не требуется."
SettingsWindow.Lookahead="Настраиваемое количество кадров упреждающего анализа"
SettingsWindow.Lookahead.Summary="Задаёт, сколько будущих кадров кодировщик изучает перед сжатием."
SettingsWindow.Lookahead.Tooltip="Более высокое значение может вернуть часть качества, потерянного из-за режима RealTime, ценой немного большей задержки и памяти. Более низкое значение сохраняет задержку минимальной. Оставьте выключенным, чтобы кодировщик решал автоматически, как встроенный кодировщик OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Требуется macOS 15 (Sequoia) или новее. Недоступно в этой системе."
SettingsWindow.Multitrack="Использовать эти кодировщики для многодорожечного видео"
SettingsWindow.Multitrack.Summary="Автоматически подставляет эти кодировщики для многодорожечного видео Twitch, Amazon IVS и Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS заменяет стандартный аппаратный кодировщик Apple настроенным выше для каждой дорожки многодорожечного видео непосредственно перед началом трансляции. Если замена невозможна, OBS тихо сохраняет исходный кодировщик — трансляция из-за этого никогда не блокируется."
