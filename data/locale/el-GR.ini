SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Κρατά τον κωδικοποιητή συγχρονισμένο με τον πραγματικό χρόνο, ευνοώντας σταθερά χαμηλή καθυστέρηση."
SettingsWindow.RealTime.Tooltip="Ζητά από το VideoToolbox να ακολουθεί τον ρυθμό εισερχόμενων καρέ αντί να αφιερώνει επιπλέον χρόνο σε κάθε καρέ. Αυτό ακριβώς περιμένουν τα Twitch, Amazon IVS και Dolby OptiView/Millicast για το βίντεο πολλαπλών κομματιών. Απενεργοποιημένο συμπεριφέρεται όπως ο εγγενής κωδικοποιητής υλικού του OBS, που μπορεί να πετύχει ελαφρώς καλύτερη ποιότητα ανά bit. Σύσταση: ενεργό για ζωντανή ροή, ανενεργό για τοπική εγγραφή."
SettingsWindow.PrioritizeSpeed="Προτεραιότητα στην ταχύτητα κωδικοποίησης έναντι της ποιότητας"
SettingsWindow.PrioritizeSpeed.Summary="Ανταλλάσσει κάποια ποιότητα για επιπλέον ταχύτητα κωδικοποίησης υπό υψηλό φόρτο."
SettingsWindow.PrioritizeSpeed.Tooltip="Οι κωδικοποιητές υλικού της Apple προτιμούν εξ ορισμού την ποιότητα, ακόμη και με ενεργό το RealTime. Ενεργοποιήστε το μόνο αν βλέπετε χαμένα ή καθυστερημένα καρέ στην ανάλυση, τον ρυθμό bit ή τον ρυθμό καρέ που επιλέξατε. Οι περισσότερες διαμορφώσεις δεν το χρειάζονται ποτέ."
SettingsWindow.Lookahead="Προσαρμοσμένος αριθμός καρέ πρόβλεψης"
SettingsWindow.Lookahead.Summary="Ορίζει πόσα επερχόμενα καρέ μελετά ο κωδικοποιητής πριν τη συμπίεση."
SettingsWindow.Lookahead.Tooltip="Μια υψηλότερη τιμή μπορεί να ανακτήσει μέρος της ποιότητας που χάνεται λόγω της λειτουργίας RealTime, με κόστος λίγο περισσότερη καθυστέρηση και μνήμη. Μια χαμηλότερη τιμή κρατά την καθυστέρηση πιο περιορισμένη. Αφήστε το απενεργοποιημένο ώστε ο κωδικοποιητής να αποφασίζει αυτόματα, όπως ο εγγενής κωδικοποιητής του OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Απαιτείται macOS 15 (Sequoia) ή νεότερο. Μη διαθέσιμο σε αυτό το σύστημα."
SettingsWindow.Multitrack="Χρήση αυτών των κωδικοποιητών για βίντεο πολλαπλών κομματιών"
SettingsWindow.Multitrack.Summary="Αντικαθιστά αυτόματα με αυτούς τους κωδικοποιητές για βίντεο πολλαπλών κομματιών σε Twitch, Amazon IVS και Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="Το OBS αντικαθιστά τον τυπικό κωδικοποιητή υλικού της Apple με τον παραπάνω διαμορφωμένο για κάθε κομμάτι βίντεο πολλαπλών κομματιών, λίγο πριν την έναρξη της ροής. Αν η αντικατάσταση δεν είναι δυνατή, το OBS διατηρεί σιωπηλά τον αρχικό κωδικοποιητή — η ροή δεν μπλοκάρεται ποτέ εξαιτίας αυτού."
