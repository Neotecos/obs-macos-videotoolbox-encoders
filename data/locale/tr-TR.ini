SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Kodlayıcıyı gerçek zamanla uyumlu tutarak istikrarlı düşük gecikmeyi önceliklendirir."
SettingsWindow.RealTime.Tooltip="VideoToolbox'a her kare için ekstra zaman harcamak yerine gelen kare hızına uymasını söyler. Twitch, Amazon IVS ve Dolby OptiView/Millicast'ın Çok Parçalı Video için beklediği tam olarak budur. Kapalıyken, bit başına biraz daha iyi kalite elde edebilen OBS'nin yerel donanım kodlayıcısı gibi davranır. Önerilen: canlı yayın için açık, yerel kayıt için kapalı."
SettingsWindow.PrioritizeSpeed="Kodlama Hızını Kaliteye Göre Önceliklendir"
SettingsWindow.PrioritizeSpeed.Summary="Ağır yük altında bir miktar kaliteyi ekstra kodlama hızıyla değiştirir."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple'ın donanım kodlayıcıları, RealTime açık olsa bile varsayılan olarak kaliteyi önceliklendirir. Bunu yalnızca seçtiğiniz çözünürlük, bit hızı veya kare hızında düşen veya gecikmeli kareler görüyorsanız etkinleştirin. Çoğu kurulumun buna hiçbir zaman ihtiyacı olmaz."
SettingsWindow.Lookahead="Özel İleriye Bakış Kare Sayısı"
SettingsWindow.Lookahead.Summary="Kodlayıcının sıkıştırmadan önce kaç gelecek kareyi inceleyeceğini belirler."
SettingsWindow.Lookahead.Tooltip="Daha yüksek bir değer, RealTime modu nedeniyle kaybedilen kalitenin bir kısmını biraz daha fazla gecikme ve bellek pahasına geri kazandırabilir. Daha düşük bir değer gecikmeyi daha sıkı tutar. OBS'nin yerel kodlayıcısı gibi kodlayıcının otomatik olarak karar vermesi için kapalı bırakın."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) veya daha yenisini gerektirir. Bu sistemde kullanılamaz."
SettingsWindow.Multitrack="Çok Parçalı Video için bu kodlayıcıları kullan"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS ve Dolby OptiView Çok Parçalı Video için bu kodlayıcıları otomatik olarak değiştirir."
SettingsWindow.Multitrack.Tooltip="OBS, yayın başlamadan hemen önce her Çok Parçalı Video parçası için standart Apple donanım kodlayıcısını yukarıda yapılandırılmış olanla değiştirir. Değişim mümkün değilse, OBS sessizce orijinal kodlayıcıyı korur — yayın bu yüzden asla engellenmez."
