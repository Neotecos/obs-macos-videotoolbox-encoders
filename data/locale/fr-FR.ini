SettingsWindow.Title="Encodeurs macOS VideoToolbox"
SettingsWindow.SectionH264="Encodeur matériel Apple VT H264 (Personnalisable)"
SettingsWindow.SectionHEVC="Encodeur matériel Apple VT HEVC (Personnalisable)"
SettingsWindow.SectionMultitrack="Vidéo multipiste"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Maintient l'encodeur au rythme du temps réel, en privilégiant une latence faible et stable."
SettingsWindow.RealTime.Tooltip="Indique à VideoToolbox de suivre la cadence d'images entrante plutôt que de passer plus de temps sur chaque image. C'est exactement ce qu'attendent Twitch, Amazon IVS et Dolby OptiView/Millicast pour la vidéo multipiste. Désactivé, il se comporte comme l'encodeur matériel natif d'OBS, qui peut atteindre une qualité légèrement meilleure par bit. Recommandé : activé pour le direct, désactivé pour l'enregistrement local."
SettingsWindow.PrioritizeSpeed="Prioriser la vitesse d'encodage sur la qualité"
SettingsWindow.PrioritizeSpeed.Summary="Échange une partie de la qualité contre une vitesse d'encodage accrue en cas de forte charge."
SettingsWindow.PrioritizeSpeed.Tooltip="Les encodeurs matériels d'Apple privilégient la qualité par défaut, même avec RealTime activé. N'activez ceci que si vous constatez des images perdues ou retardées à la résolution, au débit ou à la fréquence d'images choisis. La plupart des configurations n'en ont jamais besoin."
SettingsWindow.Lookahead="Nombre d'images d'anticipation personnalisé"
SettingsWindow.Lookahead.Summary="Définit le nombre d'images à venir que l'encodeur étudie avant de compresser."
SettingsWindow.Lookahead.Tooltip="Une valeur plus élevée peut récupérer une partie de la qualité perdue à cause du mode RealTime, au prix d'un peu plus de latence et de mémoire. Une valeur plus basse maintient une latence plus stricte. Laissez désactivé pour que l'encodeur décide automatiquement, comme l'encodeur natif d'OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Nécessite macOS 15 (Sequoia) ou plus récent. Non disponible sur ce système."
SettingsWindow.Multitrack="Utiliser ces encodeurs pour la vidéo multipiste"
SettingsWindow.Multitrack.Summary="Substitue automatiquement ces encodeurs pour la vidéo multipiste de Twitch, Amazon IVS et Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS remplace l'encodeur matériel Apple standard par celui configuré ci-dessus pour chaque piste de vidéo multipiste, juste avant le début de la diffusion. Si le remplacement n'est pas possible, OBS conserve discrètement l'encodeur d'origine — la diffusion n'est jamais bloquée pour cette raison."
