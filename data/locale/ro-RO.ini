SettingsWindow.Title="Encodere macOS VideoToolbox"
SettingsWindow.SectionH264="Encoder hardware Apple VT H264 (Personalizabil)"
SettingsWindow.SectionHEVC="Encoder hardware Apple VT HEVC (Personalizabil)"
SettingsWindow.SectionMultitrack="Video multipistă"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Menține encoderul în pas cu timpul real, favorizând o latență mică și stabilă."
SettingsWindow.RealTime.Tooltip="Îi spune VideoToolbox să urmeze rata de cadre de intrare în loc să aloce timp suplimentar fiecărui cadru. Exact asta așteaptă Twitch, Amazon IVS și Dolby OptiView/Millicast pentru video multipistă. Dezactivat, se comportă ca encoderul hardware nativ al OBS, care poate atinge o calitate ceva mai bună per bit. Recomandat: activat pentru transmisii live, dezactivat pentru înregistrare locală."
SettingsWindow.PrioritizeSpeed="Prioritizează viteza de codare în detrimentul calității"
SettingsWindow.PrioritizeSpeed.Summary="Schimbă o parte din calitate pentru viteză suplimentară de codare sub sarcină mare."
SettingsWindow.PrioritizeSpeed.Tooltip="Encoderele hardware Apple favorizează implicit calitatea, chiar și cu RealTime activat. Activați aceasta doar dacă observați cadre pierdute sau întârziate la rezoluția, bitrate-ul sau rata de cadre aleasă. Majoritatea configurațiilor nu au niciodată nevoie de asta."
SettingsWindow.Lookahead="Număr personalizat de cadre de analiză anticipată"
SettingsWindow.Lookahead.Summary="Stabilește câte cadre viitoare studiază encoderul înainte de comprimare."
SettingsWindow.Lookahead.Tooltip="O valoare mai mare poate recupera o parte din calitatea pierdută din cauza modului RealTime, cu costul unei latențe și memorii ușor mai mari. O valoare mai mică menține latența mai strânsă. Lăsați dezactivat pentru ca encoderul să decidă automat, la fel ca encoderul nativ al OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Necesită macOS 15 (Sequoia) sau mai nou. Indisponibil pe acest sistem."
SettingsWindow.Multitrack="Folosește aceste encodere pentru video multipistă"
SettingsWindow.Multitrack.Summary="Înlocuiește automat cu aceste encodere pentru video multipistă Twitch, Amazon IVS și Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS înlocuiește encoderul hardware standard Apple cu cel configurat mai sus pentru fiecare pistă video multipistă, chiar înainte de începerea transmisiei. Dacă înlocuirea nu este posibilă, OBS păstrează discret encoderul original — transmisia nu este niciodată blocată din această cauză."
