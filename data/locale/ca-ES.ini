SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Manté el codificador al ritme del temps real, afavorint una latència baixa i estable."
SettingsWindow.RealTime.Tooltip="Indica a VideoToolbox que segueixi la velocitat de fotogrames d'entrada en lloc de dedicar temps addicional a cada fotograma. Això és el que esperen Twitch, Amazon IVS i Dolby OptiView/Millicast per al vídeo multipista. Desactivat es comporta com el codificador nadiu de maquinari d'OBS, que pot assolir una qualitat lleugerament millor per bit. Recomanat: activat per a emissions en directe, desactivat per a gravació local."
SettingsWindow.PrioritizeSpeed="Prioritzar la velocitat de codificació sobre la qualitat"
SettingsWindow.PrioritizeSpeed.Summary="Sacrifica part de la qualitat a canvi de més velocitat de codificació sota càrrega alta."
SettingsWindow.PrioritizeSpeed.Tooltip="Els codificadors per maquinari d'Apple prioritzen la qualitat per defecte, fins i tot amb RealTime activat. Activeu-ho només si veieu fotogrames perduts o retardats amb la resolució, el bitrate o la velocitat de fotogrames triats. La majoria de configuracions no ho necessiten mai."
SettingsWindow.Lookahead="Nombre personalitzat de fotogrames d'anàlisi previ"
SettingsWindow.Lookahead.Summary="Defineix quants fotogrames futurs estudia el codificador abans de comprimir."
SettingsWindow.Lookahead.Tooltip="Un valor més alt pot recuperar part de la qualitat perduda pel mode RealTime, a canvi d'una mica més de latència i memòria. Un valor més baix manté la latència més ajustada. Deixeu-ho desactivat perquè el codificador ho decideixi automàticament, igual que el codificador nadiu d'OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Requereix macOS 15 (Sequoia) o posterior. No disponible en aquest sistema."
SettingsWindow.Multitrack="Utilitza aquests codificadors per al vídeo multipista"
SettingsWindow.Multitrack.Summary="Substitueix automàticament amb aquests codificadors per al vídeo multipista de Twitch, Amazon IVS i Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS substitueix el codificador de maquinari estàndard d'Apple pel configurat a dalt per a cada pista de vídeo multipista just abans de començar l'emissió. Si la substitució no és possible, OBS manté silenciosament el codificador original — l'emissió mai es bloqueja per això."
