SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Udržuje enkodér v kroku s reálným časem, upřednostňuje stabilní nízkou latenci."
SettingsWindow.RealTime.Tooltip="Říká VideoToolboxu, aby držel krok s příchozí snímkovou frekvencí místo toho, aby věnoval každému snímku více času. Přesně to očekávají Twitch, Amazon IVS a Dolby OptiView/Millicast pro vícestopé video. Při vypnutí se chová jako nativní hardwarový enkodér OBS, který může dosáhnout o něco lepší kvality na bit. Doporučení: zapnuto pro živé vysílání, vypnuto pro místní nahrávání."
SettingsWindow.PrioritizeSpeed="Upřednostnit rychlost kódování před kvalitou"
SettingsWindow.PrioritizeSpeed.Summary="Vymění část kvality za vyšší rychlost kódování při vysoké zátěži."
SettingsWindow.PrioritizeSpeed.Tooltip="Hardwarové enkodéry Apple ve výchozím nastavení upřednostňují kvalitu, i se zapnutým RealTime. Zapněte to jen pokud vidíte zahozené nebo zpožděné snímky při zvoleném rozlišení, datovém toku nebo snímkové frekvenci. Většina konfigurací to nikdy nepotřebuje."
SettingsWindow.Lookahead="Vlastní počet snímků dopředného náhledu"
SettingsWindow.Lookahead.Summary="Určuje, kolik nadcházejících snímků enkodér prozkoumá před kompresí."
SettingsWindow.Lookahead.Tooltip="Vyšší hodnota může obnovit část kvality ztracené režimem RealTime za cenu trochu vyšší latence a paměti. Nižší hodnota udržuje latenci těsnější. Ponechte vypnuté, aby enkodér rozhodoval automaticky, stejně jako nativní enkodér OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Vyžaduje macOS 15 (Sequoia) nebo novější. Na tomto systému není k dispozici."
SettingsWindow.Multitrack="Použít tyto enkodéry pro vícestopé video"
SettingsWindow.Multitrack.Summary="Automaticky nahradí těmito enkodéry vícestopé video pro Twitch, Amazon IVS a Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS těsně před zahájením vysílání nahradí standardní hardwarový enkodér Apple enkodérem nastaveným výše pro každou stopu vícestopého videa. Pokud výměna není možná, OBS tiše ponechá původní enkodér — vysílání tím nikdy není blokováno."
