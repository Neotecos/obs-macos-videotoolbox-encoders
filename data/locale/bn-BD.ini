SettingsWindow.RealTime.Tooltip="প্রতিটি ফ্রেমের জন্য অতিরিক্ত সময় নেওয়ার পরিবর্তে ইনকামিং ফ্রেম রেটের সাথে মিলিয়ে চলতে VideoToolbox-কে নির্দেশ দেয়। মাল্টিট্র্যাক ভিডিওর জন্য Twitch, Amazon IVS এবং Dolby OptiView/Millicast ঠিক এটাই আশা করে। বন্ধ থাকলে এটি OBS-এর নিজস্ব হার্ডওয়্যার এনকোডারের মতো আচরণ করে, যা প্রতি বিটে সামান্য ভালো মান দিতে পারে। সুপারিশ: লাইভ স্ট্রিমিংয়ের জন্য চালু, স্থানীয় রেকর্ডিংয়ের জন্য বন্ধ।"
