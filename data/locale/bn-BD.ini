SettingsWindow.PrioritizeSpeed.Tooltip="RealTime চালু থাকলেও Apple-এর হার্ডওয়্যার এনকোডার ডিফল্টভাবে মানকে অগ্রাধিকার দেয়। আপনার নির্বাচিত রেজোলিউশন, বিটরেট বা ফ্রেম রেটে ফ্রেম হারানো বা বিলম্বিত হলে তবেই এটি সক্রিয় করুন। বেশিরভাগ সেটআপে এটির প্রয়োজন হয় না।"
