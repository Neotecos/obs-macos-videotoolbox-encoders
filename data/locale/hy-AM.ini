SettingsWindow.RealTime.Summary="Կոդավորիչը պահում է իրական ժամանակի հետ համաքայլ՝ նախապատվությունը տալով կայուն ցածր հապաղմանը։"
SettingsWindow.RealTime.Tooltip="VideoToolbox-ին ասում է հետևել մուտքային կադրերի արագությանը՝ փոխարենը յուրաքանչյուր կադրի վրա լրացուցիչ ժամանակ ծախսելու։ Հենց սա են սպասում Twitch-ը, Amazon IVS-ը և Dolby OptiView/Millicast-ը Բազմահուն տեսանյութի համար։ Անջատված վիճակում այն գործում է ինչպես OBS-ի սեփական սարքակազմային կոդավորիչը, որը կարող է հասնել մի փոքր ավելի լավ որակի բիթ առ բիթ։ Խորհուրդ է տրվում՝ միացված ուղիղ հեռարձակման համար, անջատված՝ տեղային ձայնագրության համար։"
SettingsWindow.PrioritizeSpeed="Կոդավորման արագությանը նախապատվություն տալ որակի փոխարեն"
SettingsWindow.PrioritizeSpeed.Summary="Ծանր ծանրաբեռնվածության դեպքում որակի մի մասը փոխանակում է լրացուցիչ կոդավորման արագության հետ։"
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ի սարքակազմային կոդավորիչները լռելյայն նախապատվությունը տալիս են որակին, նույնիսկ միացված RealTime-ի դեպքում։ Միացրեք սա միայն այն դեպքում, եթե տեսնում եք կորած կամ ուշացած կադրեր ընտրված որակաստիճանում, բիթրեյթում կամ կադրերի արագությունում։ Կարգավորումների մեծ մասին դա երբեք պետք չի գալիս։"
SettingsWindow.Lookahead="Հատուկ նախնական դիտարկման կադրերի քանակ"
SettingsWindow.Lookahead.Summary="Սահմանում է, թե քանի առաջիկա կադր է կոդավորիչը ուսումնասիրում սեղմումից առաջ։"
SettingsWindow.Lookahead.Tooltip="Ավելի բարձր արժեքը կարող է վերականգնել RealTime ռեժիմի պատճառով կորած որակի մի մասը՝ մի փոքր ավելի մեծ հապաղման և հիշողության հաշվին։ Ավելի ցածր արժեքը հապաղումը պահում է ավելի կարճ։ Թողեք անջատված, որպեսզի կոդավորիչը ինքնաբերաբար որոշի, ինչպես OBS-ի սեփական կոդավորիչը։"
SettingsWindow.Lookahead.UnavailableTooltip="Պահանջում է macOS 15 (Sequoia) կամ ավելի նոր տարբերակ։ Հասանելի չէ այս համակարգում։"
SettingsWindow.Multitrack="Օգտագործել այս կոդավորիչները Բազմահուն տեսանյութի համար"
SettingsWindow.Multitrack.Summary="Ինքնաբերաբար փոխարինում է այս կոդավորիչներով Twitch-ի, Amazon IVS-ի և Dolby OptiView-ի Բազմահուն տեսանյութը։"
SettingsWindow.Multitrack.Tooltip="OBS-ը հեռարձակման մեկնարկից անմիջապես առաջ փոխարինում է Apple-ի ստանդարտ սարքակազմային կոդավորիչը վերևում կարգավորվածով՝ Բազմահուն տեսանյութի յուրաքանչյուր հունի համար։ Եթե փոխարինումն անհնար է, OBS-ը լուռ պահպանում է սկզբնական կոդավորիչը․ հեռարձակումը երբեք չի արգելափակվում սրա պատճառով։"
