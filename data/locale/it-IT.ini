SettingsWindow.SectionMultitrack="Video multitraccia"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mantiene l'encoder al passo con il tempo reale, favorendo una latenza bassa e stabile."
SettingsWindow.RealTime.Tooltip="Dice a VideoToolbox di seguire la frequenza dei fotogrammi in ingresso invece di dedicare più tempo a ciascun fotogramma. È esattamente ciò che Twitch, Amazon IVS e Dolby OptiView/Millicast si aspettano per il video multitraccia. Disattivato si comporta come l'encoder hardware nativo di OBS, che può raggiungere una qualità leggermente migliore per bit. Consigliato: attivo per lo streaming live, disattivato per la registrazione locale."
SettingsWindow.PrioritizeSpeed="Dai priorità alla velocità di codifica rispetto alla qualità"
SettingsWindow.PrioritizeSpeed.Summary="Scambia parte della qualità per una velocità di codifica extra sotto carico elevato."
SettingsWindow.PrioritizeSpeed.Tooltip="Gli encoder hardware di Apple privilegiano la qualità per impostazione predefinita, anche con RealTime attivo. Attivalo solo se noti fotogrammi persi o ritardati alla risoluzione, al bitrate o alla frequenza fotogrammi scelti. La maggior parte delle configurazioni non ne ha mai bisogno."
SettingsWindow.Lookahead="Numero personalizzato di fotogrammi di look-ahead"
SettingsWindow.Lookahead.Summary="Imposta quanti fotogrammi futuri l'encoder analizza prima di comprimere."
SettingsWindow.Lookahead.Tooltip="Un valore più alto può recuperare parte della qualità persa a causa della modalità RealTime, a costo di un po' più di latenza e memoria. Un valore più basso mantiene la latenza più contenuta. Lascialo disattivato per far decidere automaticamente l'encoder, come l'encoder nativo di OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Richiede macOS 15 (Sequoia) o versioni successive. Non disponibile su questo sistema."
SettingsWindow.Multitrack="Usa questi encoder per il video multitraccia"
SettingsWindow.Multitrack.Summary="Sostituisce automaticamente questi encoder per il video multitraccia di Twitch, Amazon IVS e Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS sostituisce l'encoder hardware Apple standard con quello configurato sopra per ogni traccia video multitraccia, appena prima dell'avvio dello streaming. Se la sostituzione non è possibile, OBS mantiene silenziosamente l'encoder originale: lo streaming non viene mai bloccato per questo motivo."
