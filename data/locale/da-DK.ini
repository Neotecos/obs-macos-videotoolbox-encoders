SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Holder encoderen i takt med realtid og favoriserer stabil, lav latens."
SettingsWindow.RealTime.Tooltip="Fortæller VideoToolbox at følge den indkommende billedhastighed i stedet for at bruge ekstra tid pr. billede. Det er, hvad Twitch, Amazon IVS og Dolby OptiView/Millicast forventer til Multitrack-video. Slået fra opfører den sig som OBS' egen hardware-encoder, der kan opnå en anelse bedre kvalitet pr. bit. Anbefales: til ved livestreaming, fra ved lokal optagelse."
SettingsWindow.PrioritizeSpeed="Prioriter kodningshastighed frem for kvalitet"
SettingsWindow.PrioritizeSpeed.Summary="Bytter noget kvalitet for ekstra kodningshastighed ved høj belastning."
SettingsWindow.PrioritizeSpeed.Tooltip="Apples hardware-encodere prioriterer som standard kvalitet, selv med RealTime slået til. Aktivér kun dette, hvis du ser droppede eller forsinkede billeder ved den valgte opløsning, bitrate eller billedhastighed. De fleste opsætninger har aldrig brug for det."
SettingsWindow.Lookahead="Brugerdefineret antal lookahead-billeder"
SettingsWindow.Lookahead.Summary="Angiver, hvor mange kommende billeder encoderen studerer, før den komprimerer."
SettingsWindow.Lookahead.Tooltip="En højere værdi kan genvinde noget af den kvalitet, der går tabt ved RealTime-tilstand, mod lidt mere latens og hukommelse. En lavere værdi holder latensen strammere. Lad den være slået fra, så encoderen selv beslutter automatisk, ligesom OBS' egen encoder."
SettingsWindow.Lookahead.UnavailableTooltip="Kræver macOS 15 (Sequoia) eller nyere. Ikke tilgængelig på dette system."
SettingsWindow.Multitrack="Brug disse encodere til Multitrack-video"
SettingsWindow.Multitrack.Summary="Skifter automatisk til disse encodere til Twitch, Amazon IVS og Dolby OptiView Multitrack-video."
SettingsWindow.Multitrack.Tooltip="OBS erstatter Apples standard hardware-encoder med den ovenfor konfigurerede for hvert Multitrack-videospor, lige inden streaming starter. Hvis udskiftningen ikke er mulig, beholder OBS stille og roligt den oprindelige encoder — streaming blokeres aldrig af dette."
