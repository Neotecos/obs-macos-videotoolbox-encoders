SettingsWindow.SectionMultitrack="Multitrack-video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Held kodaren i takt med sanntid, og prioriterer jamn, låg ventetid."
SettingsWindow.RealTime.Tooltip="Ber VideoToolbox om å følgje den innkomande biletfrekvensen i staden for å bruke ekstra tid per bilete. Dette er kva Twitch, Amazon IVS og Dolby OptiView/Millicast forventar for Multitrack-video. Av oppfører han seg som OBS sin eigen maskinvarekodar, som kan oppnå litt betre kvalitet per bit. Tilrådd: på for direktesending, av for lokal opptak."
SettingsWindow.PrioritizeSpeed="Prioriter kodingsfart framfor kvalitet"
SettingsWindow.PrioritizeSpeed.Summary="Byter noko kvalitet mot ekstra kodingsfart ved høg belastning."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple sine maskinvarekodarar prioriterer som standard kvalitet, sjølv med RealTime på. Aktiver dette berre om du ser mista eller forseinka bilete ved vald oppløysing, bitrate eller biletfrekvens. Dei fleste oppsett treng det aldri."
SettingsWindow.Lookahead="Tilpassa tal lookahead-bilete"
SettingsWindow.Lookahead.Summary="Set kor mange komande bilete kodaren studerer før komprimering."
SettingsWindow.Lookahead.Tooltip="Ein høgare verdi kan gjenvinne noko av kvaliteten som går tapt i RealTime-modus, mot litt meir ventetid og minne. Ein lågare verdi held ventetida strammare. La han stå av slik at kodaren avgjer automatisk, som OBS sin eigen kodar."
SettingsWindow.Lookahead.UnavailableTooltip="Krev macOS 15 (Sequoia) eller nyare. Ikkje tilgjengeleg på dette systemet."
SettingsWindow.Multitrack="Bruk desse kodarane for Multitrack-video"
SettingsWindow.Multitrack.Summary="Byter automatisk til desse kodarane for Multitrack-video hos Twitch, Amazon IVS og Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS erstattar Apple sin standard maskinvarekodar med den som er konfigurert ovanfor, for kvart Multitrack-videospor rett før strøyminga startar. Om bytet ikkje er mogleg, held OBS stilt fram den opphavlege kodaren — strøyminga blir aldri blokkert av dette."
