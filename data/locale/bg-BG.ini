SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Поддържа кодера в крак с реалното време, като предпочита стабилно ниска латентност."
SettingsWindow.RealTime.Tooltip="Казва на VideoToolbox да следва входящата честота на кадрите, вместо да отделя допълнително време за всеки кадър. Точно това очакват Twitch, Amazon IVS и Dolby OptiView/Millicast за Многопистово видео. При изключване се държи като родния хардуерен кодер на OBS, който може да постигне малко по-добро качество на бит. Препоръка: включено за директни излъчвания, изключено за локален запис."
SettingsWindow.PrioritizeSpeed="Приоритет на скоростта на кодиране пред качеството"
SettingsWindow.PrioritizeSpeed.Summary="Разменя част от качеството за допълнителна скорост на кодиране при голямо натоварване."
SettingsWindow.PrioritizeSpeed.Tooltip="Хардуерните кодери на Apple по подразбиране предпочитат качеството, дори с включен RealTime. Активирайте това само ако виждате изпуснати или забавени кадри при избраната резолюция, битрейт или честота на кадрите. Повечето конфигурации никога не се нуждаят от него."
SettingsWindow.Lookahead="Персонализиран брой кадри за предварителен анализ"
SettingsWindow.Lookahead.Summary="Задава колко предстоящи кадъра кодерът изучава преди компресиране."
SettingsWindow.Lookahead.Tooltip="По-висока стойност може да възстанови част от качеството, загубено заради режим RealTime, за сметка на малко повече латентност и памет. По-ниска стойност поддържа по-стегната латентност. Оставете изключено, за да остави кодера да решава автоматично, както родния кодер на OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Изисква се macOS 15 (Sequoia) или по-нова версия. Недостъпно на тази система."
SettingsWindow.Multitrack="Използвай тези кодери за Многопистово видео"
SettingsWindow.Multitrack.Summary="Автоматично заменя с тези кодери за Многопистово видео на Twitch, Amazon IVS и Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS заменя стандартния хардуерен кодер на Apple с настроения по-горе за всяка писта на Многопистово видео точно преди началото на излъчването. Ако замяната не е възможна, OBS тихо запазва оригиналния кодер — излъчването никога не се блокира заради това."
