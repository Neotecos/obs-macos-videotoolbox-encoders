SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mantén o codificador ao ritmo do tempo real, priorizando unha latencia baixa e estable."
SettingsWindow.RealTime.Tooltip="Indícalle a VideoToolbox que siga a velocidade de fotogramas de entrada en vez de dedicar tempo extra a cada fotograma. Isto é o que esperan Twitch, Amazon IVS e Dolby OptiView/Millicast para o vídeo multipista. Desactivado compórtase coma o codificador nativo por hardware de OBS, que pode acadar algo máis de calidade por bit. Recomendado: activado para retransmisións en directo, desactivado para gravación local."
SettingsWindow.PrioritizeSpeed="Priorizar velocidade de codificación sobre calidade"
SettingsWindow.PrioritizeSpeed.Summary="Sacrifica algo de calidade a cambio de máis velocidade de codificación baixo carga alta."
SettingsWindow.PrioritizeSpeed.Tooltip="Os codificadores por hardware de Apple priorizan a calidade por defecto, mesmo con RealTime activado. Actívao só se ves fotogramas perdidos ou atrasados coa resolución, o bitrate ou a taxa de fotogramas escollidos. A maioría das configuracións nunca o necesitan."
SettingsWindow.Lookahead="Número personalizado de fotogramas de análise previa"
SettingsWindow.Lookahead.Summary="Define cantos fotogramas futuros estuda o codificador antes de comprimir."
SettingsWindow.Lookahead.Tooltip="Un valor máis alto pode recuperar parte da calidade perdida polo modo RealTime, a cambio de algo máis de latencia e memoria. Un valor máis baixo mantén a latencia máis axustada. Déixao desactivado para que o codificador decida automaticamente, igual que o codificador nativo de OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Require macOS 15 (Sequoia) ou posterior. Non dispoñible neste sistema."
SettingsWindow.Multitrack="Usar estes codificadores para vídeo multipista"
SettingsWindow.Multitrack.Summary="Substitúe automaticamente con estes codificadores o vídeo multipista de Twitch, Amazon IVS e Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS substitúe o codificador por hardware estándar de Apple polo configurado arriba para cada pista de vídeo multipista xusto antes de comezar a retransmisión. Se a substitución non é posible, OBS mantén silandeiramente o codificador orixinal — a retransmisión nunca se bloquea por isto."
