SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Kodkerê bi dema rastîn re digire gav, li dûvçûyîna kêm û aram digere."
SettingsWindow.RealTime.Tooltip="Ji VideoToolbox re dibêje ku li şûna dana dem a zêde ji bo her kareyekê, li gel rêjeya kareyên tên hev bike. Ev yek e ku Twitch, Amazon IVS, û Dolby OptiView/Millicast ji bo Vîdyoya pir-rêç dixwazin. Dema girtî be, ew mîna kodkerê hardware yê xwemalî yê OBS tevdigere, ku dikare kalîteyeke hinekî çêtir ji bo her bîtê bigire. Pêşniyar: vekirî ji bo weşana zindî, girtî ji bo tomarkirina herêmî."
SettingsWindow.PrioritizeSpeed="Lezê Kodkirinê li ser Kalîteyê Pêşî Bide"
SettingsWindow.PrioritizeSpeed.Summary="Di bin barê giran de hin kalîteyê bi lezeke zêde ya kodkirinê diguherîne."
SettingsWindow.PrioritizeSpeed.Tooltip="Kodkerên hardware yên Apple bi eslê xwe kalîteyê pêşî didin, tewra bi RealTime jî vekirî be. Vê tenê wexta ku tu li ser çareserî, bîtreyt, an rêjeya kareyan a hilbijartî kareyên winda an paşdemayî dibînî veke. Piraniya sazkariyan qet pêdiviya wê pê nagirin."
SettingsWindow.Lookahead="Hejmara Kareyên Lêpirsîna Pêşîn a Taybet"
SettingsWindow.Lookahead.Summary="Diyar dike ku kodker berî tengkirinê çend kareyên tên ên pêş dixwîne."
SettingsWindow.Lookahead.Tooltip="Nirxeke bilindtir dikare beşek ji kalîteya ku ji ber moda RealTime winda bûye vegerîne, li hember bihayê hinekî dûvçûyîn û bîrê zêdetir. Nirxeke nizimtir dûvçûyînê teng digire. Wê girtî bihêle da ku kodker bixwe bi awayekî xweber biryar bide, mîna kodkerê xwemalî yê OBS."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) an nûtir hewce dike. Li ser vê pergalê ne peyda ye."
SettingsWindow.Multitrack="Ji bo Vîdyoya pir-rêç van kodkeran bikar bîne"
SettingsWindow.Multitrack.Summary="Bi awayekî xweber van kodkeran ji bo Vîdyoya pir-rêç ya Twitch, Amazon IVS, û Dolby OptiView diguherîne."
SettingsWindow.Multitrack.Tooltip="OBS berî dest pê kirina weşanê kodkerê hardware yê standard ê Apple bi yê li jor hatî mîhengkirin ji bo her rêça Vîdyoya pir-rêç diguherîne. Heke guherîn ne mimkun be, OBS bi awayekî bêdeng kodkerê resen diparêze — weşan ji ber vê qet nayê asteng kirin."
