SettingsWindow.SectionMultitrack="Multitrack-video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Håller kodaren i takt med realtid och prioriterar stabil, låg latens."
SettingsWindow.RealTime.Tooltip="Ber VideoToolbox att följa den inkommande bildfrekvensen istället för att lägga extra tid på varje bildruta. Det är vad Twitch, Amazon IVS och Dolby OptiView/Millicast förväntar sig för Multitrack-video. Avstängd beter den sig som OBS egen hårdvarukodare, som kan uppnå något bättre kvalitet per bit. Rekommenderas: på för livesändning, av för lokal inspelning."
SettingsWindow.PrioritizeSpeed="Prioritera kodningshastighet framför kvalitet"
SettingsWindow.PrioritizeSpeed.Summary="Byter en del kvalitet mot extra kodningshastighet vid hög belastning."
SettingsWindow.PrioritizeSpeed.Tooltip="Apples hårdvarukodare prioriterar som standard kvalitet, även med RealTime på. Aktivera detta endast om du ser tappade eller fördröjda bildrutor vid vald upplösning, bithastighet eller bildfrekvens. De flesta inställningar behöver aldrig detta."
SettingsWindow.Lookahead="Anpassat antal lookahead-bildrutor"
SettingsWindow.Lookahead.Summary="Anger hur många kommande bildrutor kodaren studerar innan komprimering."
SettingsWindow.Lookahead.Tooltip="Ett högre värde kan återfå en del av kvaliteten som gått förlorad på grund av RealTime-läget, till priset av lite mer latens och minne. Ett lägre värde håller latensen stramare. Lämna avstängt så att kodaren avgör automatiskt, precis som OBS egen kodare."
SettingsWindow.Lookahead.UnavailableTooltip="Kräver macOS 15 (Sequoia) eller senare. Inte tillgängligt på detta system."
SettingsWindow.Multitrack="Använd dessa kodare för Multitrack-video"
SettingsWindow.Multitrack.Summary="Byter automatiskt till dessa kodare för Multitrack-video hos Twitch, Amazon IVS och Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS ersätter Apples standardhårdvarukodare med den som konfigurerats ovan för varje Multitrack-videospår, precis innan strömningen startar. Om bytet inte är möjligt behåller OBS tyst den ursprungliga kodaren — strömningen blockeras aldrig av detta."
