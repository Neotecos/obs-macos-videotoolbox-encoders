SettingsWindow.Title="Mga Encoder ng macOS VideoToolbox"
SettingsWindow.SectionH264="Apple VT H264 Hardware Encoder (Nako-customize)"
SettingsWindow.SectionHEVC="Apple VT HEVC Hardware Encoder (Nako-customize)"
SettingsWindow.SectionMultitrack="Multitrack Video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Pinapanatili ang encoder na sabay sa real time, pinapaboran ang matatag na mababang latency."
SettingsWindow.RealTime.Tooltip="Sinasabihan ang VideoToolbox na tumugma sa papasok na frame rate sa halip na gumamit ng karagdagang oras kada frame. Ito ang inaasahan ng Twitch, Amazon IVS, at Dolby OptiView/Millicast para sa Multitrack Video. Kapag naka-off, kumikilos ito tulad ng katutubong hardware encoder ng OBS, na maaaring makamit ang bahagyang mas magandang kalidad kada bit. Inirerekomenda: naka-on para sa live streaming, naka-off para sa lokal na pag-record."
SettingsWindow.PrioritizeSpeed="Unahin ang Bilis ng Pag-encode Kaysa sa Kalidad"
SettingsWindow.PrioritizeSpeed.Summary="Ipinagpapalit ang bahagi ng kalidad para sa dagdag na bilis ng pag-encode sa mabigat na load."
SettingsWindow.PrioritizeSpeed.Tooltip="Ang mga hardware encoder ng Apple ay pinapaboran ang kalidad bilang default, kahit naka-on ang RealTime. I-enable lamang ito kung may nakikita kang na-drop o na-delay na mga frame sa napiling resolution, bitrate, o frame rate. Karamihan sa mga setup ay hindi ito kailangan."
SettingsWindow.Lookahead="Custom na Bilang ng Lookahead Frame"
SettingsWindow.Lookahead.Summary="Itinatakda kung ilang paparating na frame ang sinusuri ng encoder bago mag-compress."
SettingsWindow.Lookahead.Tooltip="Ang mas mataas na halaga ay maaaring makabawi ng kalidad na nawala dahil sa RealTime mode, kapalit ng bahagyang mas mataas na latency at memorya. Ang mas mababang halaga ay pinapanatili ang latency na mas mahigpit. Iwanan itong naka-off para hayaan ang encoder na magpasya nang awtomatiko, tulad ng katutubong encoder ng OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Nangangailangan ng macOS 15 (Sequoia) o mas bago. Hindi available sa system na ito."
SettingsWindow.Multitrack="Gamitin ang mga encoder na ito para sa Multitrack Video"
SettingsWindow.Multitrack.Summary="Awtomatikong papalitan ng mga encoder na ito ang Multitrack Video ng Twitch, Amazon IVS, at Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="Papalitan ng OBS ang karaniwang hardware encoder ng Apple ng na-configure sa itaas para sa bawat track ng Multitrack Video bago pa magsimula ang streaming. Kung hindi posible ang pagpapalit, tahimik na pinapanatili ng OBS ang orihinal na encoder — hindi kailanman naaantala ang streaming dahil dito."
