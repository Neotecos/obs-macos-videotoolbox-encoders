SettingsWindow.RealTime.Summary="Кодерны реаль вакыт белән бер тигез тота, тотрыклы түбән кичегүне өстен күрә."
SettingsWindow.RealTime.Tooltip="VideoToolbox-ка һәр кадр өчен өстәмә вакыт сарыф итү урынына керүче кадрлар ешлыгына туры килергә куша. Быны Twitch, Amazon IVS һәм Dolby OptiView/Millicast Multitrack видео өчен көтә. Сүндерелгәндә ул OBS-ның үз җиһаз кодеры кебек эшли, ул бераз яхшырак сыйфат бирә ала. Тәкъдим: туры эфир өчен кабызылган, урындагы язма өчен сүндерелгән."
SettingsWindow.PrioritizeSpeed="Кодлау тизлеген сыйфаттан өстен кую"
SettingsWindow.PrioritizeSpeed.Summary="Авыр йөкләмә астында сыйфатның бер өлешен өстәмә кодлау тизлегенә алыштыра."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ның җиһаз кодерлары, RealTime кабызылган булса да, гадәттә сыйфатка өстенлек бирә. Быны сайланган рөхсәттә, бит ешлыгында яки кадр ешлыгында кадрлар югалганда яки кичектерелгәндә генә кабызыгыз. Күпчелек көйләүләргә бу кирәкми."
SettingsWindow.Lookahead="Үзгәртелгән алдан карау кадр саны"
SettingsWindow.Lookahead.Summary="Кодер кысудан алда ничә киләчәк кадрны өйрәнәчәген билгели."
SettingsWindow.Lookahead.Tooltip="Югарырак кыйммәт RealTime режимында югалган сыйфатның бер өлешен кайтарырга ярдәм итә ала, әмма бераз күбрәк кичегү һәм хәтер сорала. Түбәнрәк кыйммәт кичегүне тарраграк тота. Кодер үзе автоматик рәвештә хәл итсен өчен сүндерелгән хәлдә калдырыгыз, OBS-ның үз кодеры кебек."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) яки яңарак кирәк. Бу системада мөмкин түгел."
SettingsWindow.Multitrack="Multitrack видео өчен бу кодерларны кулланырга"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS һәм Dolby OptiView Multitrack видеосы өчен бу кодерларны автоматик рәвештә алыштыра."
SettingsWindow.Multitrack.Tooltip="OBS, эфир башланганчы бераз алдан, һәр Multitrack видео юлы өчен стандарт Apple җиһаз кодерын югарыда көйләнгән кодерга алыштыра. Алыштыру мөмкин булмаса, OBS тыныч кына иске кодерны саклый — эфир бу сәбәпле беркайчан да тукталмый."
