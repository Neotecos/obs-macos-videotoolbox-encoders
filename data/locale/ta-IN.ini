SettingsWindow.RealTime.Summary="குறியாக்கியை நிகழ் நேரத்துடன் ஒத்திசைவாக வைத்திருக்கும், நிலையான குறைந்த தாமதத்திற்கு முன்னுரிமை அளிக்கும்."
SettingsWindow.RealTime.Tooltip="ஒவ்வொரு பிரேமிற்கும் கூடுதல் நேரம் எடுப்பதற்குப் பதிலாக, உள்வரும் பிரேம் விகிதத்துடன் பொருந்துமாறு VideoToolbox-க்கு அறிவுறுத்துகிறது. Twitch, Amazon IVS, மற்றும் Dolby OptiView/Millicast பல்தடம் வீடியோவிற்கு எதிர்பார்ப்பது இதுவே. அணைக்கப்பட்டால் இது OBS-இன் சொந்த வன்பொருள் குறியாக்கி போல செயல்படும், இது ஒரு பிட்டிற்கு சற்று சிறந்த தரத்தை அடையலாம். பரிந்துரை: நேரடி ஒளிபரப்புக்கு இயக்கு, உள்ளூர் பதிவுக்கு அணை."
SettingsWindow.PrioritizeSpeed="தரத்தை விட குறியாக்க வேகத்திற்கு முன்னுரிமை அளி"
SettingsWindow.PrioritizeSpeed.Summary="அதிக சுமையின் கீழ் கூடுதல் குறியாக்க வேகத்திற்காக சில தரத்தை பரிமாறுகிறது."
SettingsWindow.PrioritizeSpeed.Tooltip="RealTime இயக்கத்தில் இருந்தாலும், Apple-இன் வன்பொருள் குறியாக்கிகள் இயல்பாகவே தரத்திற்கு முன்னுரிமை அளிக்கின்றன. நீங்கள் தேர்ந்தெடுத்த தெளிவுத்திறன், பிட்ரேட் அல்லது பிரேம் விகிதத்தில் இழந்த அல்லது தாமதமான பிரேம்களைப் பார்த்தால் மட்டுமே இதை இயக்கவும். பெரும்பாலான அமைப்புகளுக்கு இது ஒருபோதும் தேவையில்லை."
SettingsWindow.Lookahead="தனிப்பயன் முன்பார்வை பிரேம் எண்ணிக்கை"
SettingsWindow.Lookahead.Summary="அமுக்குவதற்கு முன் குறியாக்கி எத்தனை வரவிருக்கும் பிரேம்களை ஆய்வு செய்யும் என்பதை அமைக்கிறது."
SettingsWindow.Lookahead.Tooltip="அதிக மதிப்பு RealTime பயன்முறையால் இழந்த தரத்தில் சிலவற்றை மீட்டெடுக்கலாம், சற்று அதிக தாமதம் மற்றும் நினைவகத்தின் விலையில். குறைந்த மதிப்பு தாமதத்தை இறுக்கமாக வைத்திருக்கும். OBS-இன் சொந்த குறியாக்கியைப் போலவே, குறியாக்கி தானாகவே முடிவு செய்ய அணைத்து வையுங்கள்."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) அல்லது புதியது தேவை. இந்த கணினியில் கிடைக்கவில்லை."
SettingsWindow.Multitrack="பல்தடம் வீடியோவிற்கு இந்த குறியாக்கிகளைப் பயன்படுத்து"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS, மற்றும் Dolby OptiView பல்தடம் வீடியோவிற்கு இந்த குறியாக்கிகளை தானாகவே மாற்றுகிறது."
SettingsWindow.Multitrack.Tooltip="ஒளிபரப்பு தொடங்குவதற்கு சற்று முன், ஒவ்வொரு பல்தடம் வீடியோ தடத்திற்கும் நிலையான Apple வன்பொருள் குறியாக்கியை மேலே கட்டமைக்கப்பட்டதுடன் OBS மாற்றுகிறது. மாற்றம் சாத்தியமில்லை என்றால், OBS அமைதியாக அசல் குறியாக்கியை வைத்திருக்கும் — இதன் காரணமாக ஒளிபரப்பு ஒருபோதும் தடுக்கப்படாது."
