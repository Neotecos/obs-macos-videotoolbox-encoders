SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Održava enkoder u koraku sa stvarnim vremenom, dajući prednost stabilnoj niskoj latenciji."
SettingsWindow.RealTime.Tooltip="Govori VideoToolboxu da prati dolaznu brzinu sličica umjesto da troši dodatno vrijeme po sličici. Upravo to očekuju Twitch, Amazon IVS i Dolby OptiView/Millicast za višestazni video. Isključeno se ponaša kao izvorni hardverski enkoder OBS-a, koji može postići nešto bolju kvalitetu po bitu. Preporuka: uključeno za izravni prijenos, isključeno za lokalno snimanje."
SettingsWindow.PrioritizeSpeed="Dati prednost brzini kodiranja nad kvalitetom"
SettingsWindow.PrioritizeSpeed.Summary="Zamjenjuje dio kvalitete za dodatnu brzinu kodiranja pod velikim opterećenjem."
SettingsWindow.PrioritizeSpeed.Tooltip="Applovi hardverski enkoderi zadano daju prednost kvaliteti, čak i uz uključen RealTime. Uključite ovo samo ako primjećujete izgubljene ili odgođene sličice pri odabranoj rezoluciji, protoku bitova ili brzini sličica. Većina postavki to nikada ne treba."
SettingsWindow.Lookahead="Prilagođeni broj sličica unaprijednog pregleda"
SettingsWindow.Lookahead.Summary="Određuje koliko nadolazećih sličica enkoder proučava prije kompresije."
SettingsWindow.Lookahead.Tooltip="Viša vrijednost može vratiti dio kvalitete izgubljene zbog RealTime načina rada, uz malo veću latenciju i memoriju. Niža vrijednost održava latenciju strožom. Ostavite isključeno kako bi enkoder automatski odlučivao, kao izvorni enkoder OBS-a."
SettingsWindow.Lookahead.UnavailableTooltip="Zahtijeva macOS 15 (Sequoia) ili noviji. Nije dostupno na ovom sustavu."
SettingsWindow.Multitrack="Koristi ove enkodere za višestazni video"
SettingsWindow.Multitrack.Summary="Automatski zamjenjuje ove enkodere za višestazni video Twitcha, Amazon IVS-a i Dolby OptiViewa."
SettingsWindow.Multitrack.Tooltip="OBS zamjenjuje standardni Appleov hardverski enkoder onim konfiguriranim gore za svaku stazu višestaznog videa, neposredno prije početka strujanja. Ako zamjena nije moguća, OBS tiho zadržava izvorni enkoder — strujanje time nikada nije blokirano."
