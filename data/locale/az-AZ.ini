SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Kodlayıcını real vaxtla ayaqlaşdırır, sabit aşağı gecikməyə üstünlük verir."
SettingsWindow.RealTime.Tooltip="VideoToolbox-a hər kadr üçün əlavə vaxt sərf etmək əvəzinə gələn kadr sürətinə uyğunlaşmağı bildirir. Bu, Twitch, Amazon IVS və Dolby OptiView/Millicast-ın Multitrack Video üçün gözlədiyi davranışdır. Söndürüldükdə OBS-in daxili aparat kodlayıcısı kimi davranır və bit başına bir az daha yaxşı keyfiyyətə çata bilər. Tövsiyə: canlı yayım üçün aktiv, yerli qeydiyyat üçün deaktiv."
SettingsWindow.PrioritizeSpeed="Kodlaşdırma Sürətini Keyfiyyətdən Üstün Tut"
SettingsWindow.PrioritizeSpeed.Summary="Ağır yük altında keyfiyyəti əlavə kodlaşdırma sürəti ilə dəyişir."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ın aparat kodlayıcıları RealTime aktiv olsa belə, defolt olaraq keyfiyyətə üstünlük verir. Bunu yalnız seçdiyiniz ölçü, bit sürəti və ya kadr sürətində itən və ya gecikən kadrlar görsəniz aktivləşdirin. Əksər qurğularda buna ehtiyac yoxdur."
SettingsWindow.Lookahead="Xüsusi İrəli Baxış Kadr Sayı"
SettingsWindow.Lookahead.Summary="Kodlayıcının sıxılmadan əvvəl neçə gələcək kadrı araşdıracağını təyin edir."
SettingsWindow.Lookahead.Tooltip="Daha yüksək dəyər RealTime rejimində itirilən keyfiyyətin bir hissəsini bərpa edə bilər, bunun əvəzinə bir az daha çox gecikmə və yaddaş tələb olunur. Daha aşağı dəyər gecikməni daha dar saxlayır. Kodlayıcının avtomatik qərar verməsi üçün söndürülmüş buraxın, OBS-in daxili kodlayıcısı kimi."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) və ya daha yenisini tələb edir. Bu sistemdə mövcud deyil."
SettingsWindow.Multitrack="Multitrack Video üçün bu kodlayıcıları istifadə et"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS və Dolby OptiView Multitrack Video üçün bu kodlayıcıları avtomatik əvəz edir."
SettingsWindow.Multitrack.Tooltip="OBS, yayım başlamazdan dərhal əvvəl hər Multitrack Video treki üçün standart Apple aparat kodlayıcısını yuxarıda tənzimlənmiş kodlayıcı ilə əvəz edir. Əvəzetmə mümkün olmazsa, OBS sakitcə orijinal kodlayıcını saxlayır — yayım heç vaxt bunun ucbatından bloklanmır."
