SettingsWindow.SectionMultitrack="Video Multitrek"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mengekalkan pengekod selari dengan masa nyata, mengutamakan kependaman rendah yang stabil."
SettingsWindow.RealTime.Tooltip="Memberitahu VideoToolbox untuk mengikut kadar bingkai masuk berbanding mengambil masa tambahan bagi setiap bingkai. Inilah yang diharapkan oleh Twitch, Amazon IVS, dan Dolby OptiView/Millicast untuk Video Multitrek. Apabila dimatikan, ia berkelakuan seperti pengekod perkakasan asli OBS, yang boleh mencapai kualiti sedikit lebih baik bagi setiap bit. Disyorkan: hidup untuk penstriman langsung, mati untuk rakaman tempatan."
SettingsWindow.PrioritizeSpeed="Utamakan Kelajuan Pengekodan Berbanding Kualiti"
SettingsWindow.PrioritizeSpeed.Summary="Menukar sebahagian kualiti untuk kelajuan pengekodan tambahan di bawah beban berat."
SettingsWindow.PrioritizeSpeed.Tooltip="Pengekod perkakasan Apple mengutamakan kualiti secara lalai, walaupun RealTime dihidupkan. Aktifkan ini hanya jika anda melihat bingkai yang tercicir atau tertangguh pada resolusi, kadar bit, atau kadar bingkai pilihan anda. Kebanyakan persediaan tidak pernah memerlukannya."
SettingsWindow.Lookahead="Bilangan Bingkai Lookahead Tersuai"
SettingsWindow.Lookahead.Summary="Menetapkan berapa banyak bingkai akan datang yang dikaji pengekod sebelum memampatkan."
SettingsWindow.Lookahead.Tooltip="Nilai yang lebih tinggi boleh memulihkan sebahagian kualiti yang hilang akibat mod RealTime, dengan kos kependaman dan memori yang sedikit lebih tinggi. Nilai yang lebih rendah mengekalkan kependaman lebih ketat. Biarkan ia mati supaya pengekod memutuskan secara automatik, sama seperti pengekod asli OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Memerlukan macOS 15 (Sequoia) atau lebih baharu. Tidak tersedia pada sistem ini."
SettingsWindow.Multitrack="Gunakan pengekod ini untuk Video Multitrek"
SettingsWindow.Multitrack.Summary="Menukar secara automatik kepada pengekod ini untuk Video Multitrek Twitch, Amazon IVS, dan Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS menggantikan pengekod perkakasan standard Apple dengan yang dikonfigurasikan di atas untuk setiap trek Video Multitrek sejurus sebelum penstriman bermula. Jika pertukaran tidak dapat dilakukan, OBS secara senyap mengekalkan pengekod asal — penstriman tidak akan disekat kerana ini."
