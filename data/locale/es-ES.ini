SettingsWindow.SectionMultitrack="Vídeo multipista"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mantiene el codificador al ritmo del tiempo real, priorizando una latencia baja y estable."
SettingsWindow.RealTime.Tooltip="Indica a VideoToolbox que siga la velocidad de fotogramas de entrada en lugar de dedicar tiempo extra a cada fotograma. Esto es lo que esperan Twitch, Amazon IVS y Dolby OptiView/Millicast para el vídeo multipista. Desactivado se comporta como el codificador nativo por hardware de OBS, que puede lograr algo más de calidad por bit. Recomendado: activado para retransmisiones en directo, desactivado para grabación local."
SettingsWindow.PrioritizeSpeed="Priorizar velocidad de codificación sobre calidad"
SettingsWindow.PrioritizeSpeed.Summary="Sacrifica algo de calidad a cambio de más velocidad de codificación bajo carga alta."
SettingsWindow.PrioritizeSpeed.Tooltip="Los codificadores por hardware de Apple priorizan la calidad por defecto, incluso con RealTime activado. Actívalo solo si ves fotogramas perdidos o retrasados con la resolución, el bitrate o la tasa de fotogramas elegidos. La mayoría de configuraciones nunca lo necesitan."
SettingsWindow.Lookahead="Número personalizado de fotogramas de análisis previo"
SettingsWindow.Lookahead.Summary="Define cuántos fotogramas futuros estudia el codificador antes de comprimir."
SettingsWindow.Lookahead.Tooltip="Un valor más alto puede recuperar parte de la calidad perdida por el modo RealTime, a costa de algo más de latencia y memoria. Un valor más bajo mantiene la latencia más ajustada. Déjalo desactivado para que el codificador decida automáticamente, igual que el codificador nativo de OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Requiere macOS 15 (Sequoia) o posterior. No disponible en este sistema."
SettingsWindow.Multitrack="Usar estos codificadores para vídeo multipista"
SettingsWindow.Multitrack.Summary="Sustituye automáticamente con estos codificadores el vídeo multipista de Twitch, Amazon IVS y Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS sustituye el codificador por hardware estándar de Apple por el configurado arriba para cada pista de vídeo multipista justo antes de empezar la retransmisión. Si la sustitución no es posible, OBS mantiene silenciosamente el codificador original — la retransmisión nunca se bloquea por esto."
