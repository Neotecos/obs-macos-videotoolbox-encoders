SettingsWindow.RealTime.Tooltip="එක් එක් රාමුවකට අමතර කාලයක් ගැනීම වෙනුවට ලැබෙන රාමු වේගයට ගැලපීමට VideoToolbox වෙත දන්වයි. බහු-මාර්ග වීඩියෝ සඳහා Twitch, Amazon IVS, සහ Dolby OptiView/Millicast බලාපොරොත්තු වන්නේ මෙයයි. අක්‍රීයව තිබෙන විට එය OBS හි ස්වදේශීය දෘඩාංග කේතාංකකය මෙන් හැසිරෙන අතර, එමගින් බිට් එකකට තරමක් හොඳ ගුණාත්මක භාවයක් ලබාගත හැක. නිර්දේශිතයි: සජීවී විකාශය සඳහා සක්‍රීය, දේශීය පටිගත කිරීම සඳහා අක්‍රීය."
