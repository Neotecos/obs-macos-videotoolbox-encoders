SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Kodirnik ohranja v koraku z realnim časom, pri čemer daje prednost stabilni nizki zakasnitvi."
SettingsWindow.RealTime.Tooltip="VideoToolboxu naroči, naj sledi vhodni hitrosti sličic namesto porabe dodatnega časa za vsako sličico. To je natanko tisto, kar Twitch, Amazon IVS in Dolby OptiView/Millicast pričakujejo za večsledni video. Izklopljeno se obnaša kot izvorni strojni kodirnik OBS, ki lahko doseže nekoliko boljšo kakovost na bit. Priporočeno: vklopljeno za neposredno predvajanje, izklopljeno za lokalno snemanje."
SettingsWindow.PrioritizeSpeed="Daj prednost hitrosti kodiranja pred kakovostjo"
SettingsWindow.PrioritizeSpeed.Summary="Ob veliki obremenitvi zamenja del kakovosti za dodatno hitrost kodiranja."
SettingsWindow.PrioritizeSpeed.Tooltip="Strojni kodirniki Apple privzeto dajejo prednost kakovosti, tudi z vklopljenim RealTime. To vklopite le, če opazite izgubljene ali zakasnjene sličice pri izbrani ločljivosti, bitni hitrosti ali hitrosti sličic. Večina nastavitev tega nikoli ne potrebuje."
SettingsWindow.Lookahead="Prilagojeno število sličic vnaprejšnjega pregleda"
SettingsWindow.Lookahead.Summary="Določa, koliko prihajajočih sličic kodirnik preuči pred stiskanjem."
SettingsWindow.Lookahead.Tooltip="Višja vrednost lahko povrne del kakovosti, izgubljene zaradi načina RealTime, na račun nekoliko večje zakasnitve in pomnilnika. Nižja vrednost ohranja zakasnitev tesnejšo. Pustite izklopljeno, da se kodirnik odloči samodejno, tako kot izvorni kodirnik OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Zahteva macOS 15 (Sequoia) ali novejši. Na tem sistemu ni na voljo."
SettingsWindow.Multitrack="Uporabi te kodirnike za večsledni video"
SettingsWindow.Multitrack.Summary="Samodejno zamenja s temi kodirniki za večsledni video Twitch, Amazon IVS in Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS tik pred začetkom pretakanja zamenja standardni strojni kodirnik Apple z zgoraj nastavljenim za vsako sled večslednega videa. Če zamenjava ni mogoča, OBS tiho obdrži izvirni kodirnik — pretakanje zaradi tega nikoli ni blokirano."
