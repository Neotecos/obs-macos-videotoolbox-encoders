SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="एन्कोडर को वास्तविक समय के साथ तालमेल में रखता है, स्थिर कम विलंबता को प्राथमिकता देता है।"
SettingsWindow.RealTime.Tooltip="हर फ़्रेम पर अतिरिक्त समय लगाने के बजाय, VideoToolbox को आने वाली फ़्रेम दर से मेल खाने के लिए कहता है। यही Twitch, Amazon IVS और Dolby OptiView/Millicast मल्टीट्रैक वीडियो के लिए अपेक्षा करते हैं। बंद होने पर यह OBS के मूल हार्डवेयर एन्कोडर की तरह व्यवहार करता है, जो प्रति बिट थोड़ी बेहतर गुणवत्ता प्राप्त कर सकता है। अनुशंसित: लाइव स्ट्रीमिंग के लिए चालू, स्थानीय रिकॉर्डिंग के लिए बंद।"
SettingsWindow.PrioritizeSpeed="गुणवत्ता की तुलना में एन्कोडिंग गति को प्राथमिकता दें"
SettingsWindow.PrioritizeSpeed.Summary="भारी लोड के तहत अतिरिक्त एन्कोडिंग गति के लिए कुछ गुणवत्ता का व्यापार करता है।"
SettingsWindow.PrioritizeSpeed.Tooltip="RealTime चालू होने पर भी, Apple के हार्डवेयर एन्कोडर डिफ़ॉल्ट रूप से गुणवत्ता को प्राथमिकता देते हैं। इसे केवल तभी सक्षम करें जब आप अपने चुने हुए रिज़ॉल्यूशन, बिटरेट या फ़्रेम दर पर छूटे हुए या विलंबित फ़्रेम देखें। अधिकांश सेटअप को इसकी कभी आवश्यकता नहीं होती।"
SettingsWindow.Lookahead="कस्टम लुकअहेड फ़्रेम संख्या"
SettingsWindow.Lookahead.Summary="यह सेट करता है कि कंप्रेस करने से पहले एन्कोडर कितने आगामी फ़्रेम का अध्ययन करता है।"
SettingsWindow.Lookahead.Tooltip="उच्चतर मान RealTime मोड के कारण खोई गई कुछ गुणवत्ता को पुनः प्राप्त कर सकता है, कुछ अधिक विलंबता और मेमोरी की कीमत पर। निम्नतर मान विलंबता को अधिक सीमित रखता है। एन्कोडर को स्वचालित रूप से निर्णय लेने देने के लिए इसे बंद छोड़ दें, ठीक OBS के मूल एन्कोडर की तरह।"
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) या नया चाहिए। इस सिस्टम पर उपलब्ध नहीं है।"
SettingsWindow.Multitrack="मल्टीट्रैक वीडियो के लिए इन एन्कोडर का उपयोग करें"
SettingsWindow.Multitrack.Summary="Twitch, Amazon IVS और Dolby OptiView मल्टीट्रैक वीडियो के लिए स्वचालित रूप से इन एन्कोडर को बदल देता है।"
SettingsWindow.Multitrack.Tooltip="स्ट्रीमिंग शुरू होने से ठीक पहले, OBS प्रत्येक मल्टीट्रैक वीडियो ट्रैक के लिए मानक Apple हार्डवेयर एन्कोडर को ऊपर कॉन्फ़िगर किए गए एन्कोडर से बदल देता है। यदि बदलाव संभव नहीं है, तो OBS चुपचाप मूल एन्कोडर को बनाए रखता है — इसके कारण स्ट्रीमिंग कभी अवरुद्ध नहीं होती।"
