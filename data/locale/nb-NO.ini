SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Holder koderen i takt med sanntid, og prioriterer jevn, lav ventetid."
SettingsWindow.RealTime.Tooltip="Ber VideoToolbox om å følge den innkommende bildefrekvensen i stedet for å bruke ekstra tid per bilde. Dette er hva Twitch, Amazon IVS og Dolby OptiView/Millicast forventer for Multitrack-video. Av oppfører den seg som OBS' egen maskinvarekoder, som kan oppnå litt bedre kvalitet per bit. Anbefalt: på for direktesending, av for lokal opptak."
SettingsWindow.PrioritizeSpeed="Prioriter kodingshastighet fremfor kvalitet"
SettingsWindow.PrioritizeSpeed.Summary="Bytter noe kvalitet mot ekstra kodingshastighet ved høy belastning."
SettingsWindow.PrioritizeSpeed.Tooltip="Apples maskinvarekodere prioriterer som standard kvalitet, selv med RealTime på. Aktiver dette bare hvis du ser mistede eller forsinkede bilder ved valgt oppløsning, bitrate eller bildefrekvens. De fleste oppsett trenger det aldri."
SettingsWindow.Lookahead="Tilpasset antall lookahead-bilder"
SettingsWindow.Lookahead.Summary="Angir hvor mange kommende bilder koderen studerer før komprimering."
SettingsWindow.Lookahead.Tooltip="En høyere verdi kan gjenvinne noe av kvaliteten som går tapt i RealTime-modus, mot litt mer ventetid og minne. En lavere verdi holder ventetiden strammere. La den stå av slik at koderen avgjør automatisk, som OBS' egen koder."
SettingsWindow.Lookahead.UnavailableTooltip="Krever macOS 15 (Sequoia) eller nyere. Ikke tilgjengelig på dette systemet."
SettingsWindow.Multitrack="Bruk disse koderne for Multitrack-video"
SettingsWindow.Multitrack.Summary="Bytter automatisk til disse koderne for Multitrack-video hos Twitch, Amazon IVS og Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS erstatter Apples standard maskinvarekoder med den som er konfigurert ovenfor, for hvert Multitrack-videospor rett før strømmingen starter. Hvis bytte ikke er mulig, beholder OBS stille og rolig den opprinnelige koderen — strømmingen blokkeres aldri av dette."
