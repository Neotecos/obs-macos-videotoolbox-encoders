SettingsWindow.SectionMultitrack="Video shumëpistë"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="E mban enkoderin në hap me kohën reale, duke favorizuar një vonesë të ulët e të qëndrueshme."
SettingsWindow.RealTime.Tooltip="I thotë VideoToolbox të ndjekë shpejtësinë e kuadrove hyrëse në vend që të shpenzojë kohë shtesë për çdo kuadro. Kjo është ajo që presin Twitch, Amazon IVS dhe Dolby OptiView/Millicast për videon shumëpistë. I çaktivizuar, sillet si enkoderi hardueror vendas i OBS, i cili mund të arrijë cilësi paksa më të mirë për bit. Rekomandohet: i aktivizuar për transmetim direkt, i çaktivizuar për regjistrim lokal."
SettingsWindow.PrioritizeSpeed="Jepi përparësi shpejtësisë së kodimit ndaj cilësisë"
SettingsWindow.PrioritizeSpeed.Summary="Shkëmben pjesë të cilësisë për shpejtësi shtesë kodimi nën ngarkesë të lartë."
SettingsWindow.PrioritizeSpeed.Tooltip="Enkoderat harduerorë të Apple i japin përparësi cilësisë si parazgjedhje, edhe me RealTime të aktivizuar. Aktivizojeni këtë vetëm nëse shihni kuadro të humbura ose të vonuara në rezolucionin, bitrate-in ose shpejtësinë e kuadrove të zgjedhur. Shumica e konfigurimeve nuk kanë nevojë kurrë për të."
SettingsWindow.Lookahead="Numër i personalizuar kuadrosh shikimi paraprak"
SettingsWindow.Lookahead.Summary="Cakton sa kuadro të ardhshëm studion enkoderi para kompresimit."
SettingsWindow.Lookahead.Tooltip="Një vlerë më e lartë mund të rikuperojë pjesë të cilësisë së humbur nga modaliteti RealTime, në kurriz të pak më shumë vonesë dhe memorie. Një vlerë më e ulët e mban vonesën më të ngushtë. Lëreni të çaktivizuar që enkoderi të vendosë automatikisht, njësoj si enkoderi vendas i OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Kërkon macOS 15 (Sequoia) ose më të ri. Nuk ofrohet në këtë sistem."
SettingsWindow.Multitrack="Përdor këta enkoderë për videon shumëpistë"
SettingsWindow.Multitrack.Summary="Zëvendëson automatikisht me këta enkoderë videon shumëpistë të Twitch, Amazon IVS dhe Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS zëvendëson enkoderin standard hardueror të Apple me atë të konfiguruar më sipër për çdo pistë të videos shumëpistë, pak para se të fillojë transmetimi. Nëse zëvendësimi nuk është i mundur, OBS ruan në heshtje enkoderin origjinal — transmetimi nuk bllokohet kurrë për shkak të kësaj."
