SettingsWindow.Title="Bộ mã hóa macOS VideoToolbox"
SettingsWindow.SectionH264="Bộ mã hóa phần cứng Apple VT H264 (Có thể tùy chỉnh)"
SettingsWindow.SectionHEVC="Bộ mã hóa phần cứng Apple VT HEVC (Có thể tùy chỉnh)"
SettingsWindow.SectionMultitrack="Video đa luồng"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Giữ bộ mã hóa đồng bộ với thời gian thực, ưu tiên độ trễ thấp ổn định."
SettingsWindow.RealTime.Tooltip="Yêu cầu VideoToolbox bám theo tốc độ khung hình đến thay vì dành thêm thời gian cho mỗi khung hình. Đây chính xác là điều Twitch, Amazon IVS và Dolby OptiView/Millicast mong đợi cho Video đa luồng. Khi tắt, nó hoạt động như bộ mã hóa phần cứng gốc của OBS, có thể đạt chất lượng tốt hơn một chút trên mỗi bit. Khuyến nghị: bật khi phát trực tiếp, tắt khi ghi hình cục bộ."
SettingsWindow.PrioritizeSpeed="Ưu tiên tốc độ mã hóa hơn chất lượng"
SettingsWindow.PrioritizeSpeed.Summary="Đánh đổi một phần chất lượng để lấy tốc độ mã hóa bổ sung khi tải nặng."
SettingsWindow.PrioritizeSpeed.Tooltip="Các bộ mã hóa phần cứng của Apple ưu tiên chất lượng theo mặc định, ngay cả khi bật RealTime. Chỉ bật tùy chọn này nếu bạn thấy khung hình bị rớt hoặc trễ ở độ phân giải, bitrate hoặc tốc độ khung hình đã chọn. Hầu hết các cấu hình không bao giờ cần đến nó."
SettingsWindow.Lookahead="Số khung hình xem trước tùy chỉnh"
SettingsWindow.Lookahead.Summary="Đặt số khung hình sắp tới mà bộ mã hóa nghiên cứu trước khi nén."
SettingsWindow.Lookahead.Tooltip="Giá trị cao hơn có thể khôi phục một phần chất lượng bị mất do chế độ RealTime, với chi phí độ trễ và bộ nhớ nhiều hơn một chút. Giá trị thấp hơn giữ độ trễ chặt chẽ hơn. Để tắt để bộ mã hóa tự động quyết định, giống như bộ mã hóa gốc của OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Yêu cầu macOS 15 (Sequoia) trở lên. Không khả dụng trên hệ thống này."
SettingsWindow.Multitrack="Sử dụng các bộ mã hóa này cho Video đa luồng"
SettingsWindow.Multitrack.Summary="Tự động thay thế bằng các bộ mã hóa này cho Video đa luồng của Twitch, Amazon IVS và Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS thay thế bộ mã hóa phần cứng chuẩn của Apple bằng bộ mã hóa được cấu hình ở trên cho mỗi luồng Video đa luồng, ngay trước khi bắt đầu phát trực tiếp. Nếu không thể thay thế, OBS âm thầm giữ lại bộ mã hóa gốc — việc phát trực tiếp không bao giờ bị chặn vì điều này."
