SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="שומר על המקודד בקצב הזמן האמיתי, ומעדיף השהיה נמוכה ויציבה."
SettingsWindow.RealTime.Tooltip="אומר ל-VideoToolbox להתאים לקצב הפריימים הנכנס במקום להשקיע זמן נוסף בכל פריים. זה בדיוק מה ש-Twitch, Amazon IVS ו-Dolby OptiView/Millicast מצפים לו עבור וידאו מרובה ערוצים. כשכבוי, הוא מתנהג כמו מקודד החומרה המובנה של OBS, שיכול להשיג איכות מעט טובה יותר לכל ביט. מומלץ: מופעל לשידור חי, כבוי להקלטה מקומית."
SettingsWindow.PrioritizeSpeed="תעדוף מהירות קידוד על פני איכות"
SettingsWindow.PrioritizeSpeed.Summary="מחליף חלק מהאיכות במהירות קידוד נוספת תחת עומס כבד."
SettingsWindow.PrioritizeSpeed.Tooltip="מקודדי החומרה של Apple מעדיפים איכות כברירת מחדל, גם כש-RealTime מופעל. הפעל זאת רק אם אתה רואה פריימים שנשמטו או התעכבו ברזולוציה, בקצב הביטים או בקצב הפריימים שבחרת. רוב ההגדרות לעולם לא זקוקות לזה."
SettingsWindow.Lookahead="מספר פריימי צפייה קדימה מותאם אישית"
SettingsWindow.Lookahead.Summary="קובע כמה פריימים עתידיים המקודד בוחן לפני הדחיסה."
SettingsWindow.Lookahead.Tooltip="ערך גבוה יותר יכול להחזיר חלק מהאיכות שאבדה עקב מצב RealTime, במחיר של מעט יותר השהיה וזיכרון. ערך נמוך יותר שומר על השהיה הדוקה יותר. השאר כבוי כדי שהמקודד יחליט אוטומטית, בדיוק כמו המקודד המובנה של OBS."
SettingsWindow.Lookahead.UnavailableTooltip="דורש macOS 15 (Sequoia) או גרסה חדשה יותר. לא זמין במערכת זו."
SettingsWindow.Multitrack="השתמש במקודדים אלה עבור וידאו מרובה ערוצים"
SettingsWindow.Multitrack.Summary="מחליף אוטומטית למקודדים אלה עבור וידאו מרובה ערוצים של Twitch, Amazon IVS ו-Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS מחליף את מקודד החומרה הסטנדרטי של Apple במקודד שהוגדר למעלה עבור כל ערוץ וידאו מרובה ערוצים, ממש לפני תחילת השידור. אם ההחלפה אינה אפשרית, OBS שומר בשקט על המקודד המקורי — השידור לעולם לא נחסם בגלל זה."
