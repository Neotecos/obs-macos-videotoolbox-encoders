SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="エンコーダーをリアルタイムに同期させ、安定した低遅延を優先します。"
SettingsWindow.RealTime.Tooltip="各フレームに余分な時間をかけるのではなく、入力フレームレートに合わせるようVideoToolboxに指示します。これはTwitch、Amazon IVS、Dolby OptiView/Millicastがマルチトラック動画に求めている動作です。オフにするとOBSのネイティブハードウェアエンコーダーのように動作し、ビットあたりの品質がわずかに向上する場合があります。推奨:ライブ配信ではオン、ローカル録画ではオフ。"
SettingsWindow.PrioritizeSpeed="品質よりエンコード速度を優先"
SettingsWindow.PrioritizeSpeed.Summary="高負荷時に一部の品質をエンコード速度の向上と引き換えます。"
SettingsWindow.PrioritizeSpeed.Tooltip="AppleのハードウェアエンコーダーはRealTimeがオンでも既定で品質を優先します。選択した解像度、ビットレート、フレームレートでフレームの欠落や遅延が見られる場合にのみこれを有効にしてください。ほとんどの設定では必要ありません。"
SettingsWindow.Lookahead="カスタム先読みフレーム数"
SettingsWindow.Lookahead.Summary="圧縮前にエンコーダーが調べる先のフレーム数を設定します。"
SettingsWindow.Lookahead.Tooltip="値を高くするとRealTimeモードで失われた品質の一部を取り戻せますが、遅延とメモリ使用量がやや増えます。値を低くすると遅延を抑えられます。オフのままにすると、OBSのネイティブエンコーダーと同様にエンコーダーが自動的に決定します。"
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15(Sequoia)以降が必要です。このシステムでは利用できません。"
SettingsWindow.Multitrack="マルチトラック動画にこれらのエンコーダーを使用する"
SettingsWindow.Multitrack.Summary="Twitch、Amazon IVS、Dolby OptiViewのマルチトラック動画にこれらのエンコーダーを自動的に置き換えます。"
SettingsWindow.Multitrack.Tooltip="配信開始の直前に、OBSは各マルチトラック動画トラックの標準Appleハードウェアエンコーダーを上記で設定したものに置き換えます。置き換えができない場合、OBSは黙って元のエンコーダーを維持します。これによって配信がブロックされることはありません。"
