SettingsWindow.SectionMultitrack="Multitrack-Video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Hält den Encoder im Takt der Echtzeit, zugunsten einer gleichmäßig niedrigen Latenz."
SettingsWindow.RealTime.Tooltip="Weist VideoToolbox an, sich an die eingehende Bildrate zu halten, statt sich für jedes Bild mehr Zeit zu nehmen. Genau das erwarten Twitch, Amazon IVS und Dolby OptiView/Millicast für Multitrack-Video. Ausgeschaltet verhält es sich wie OBS' nativer Hardware-Encoder, der eine etwas bessere Qualität pro Bit erreichen kann. Empfehlung: an für Livestreaming, aus für lokale Aufnahmen."
SettingsWindow.PrioritizeSpeed="Kodierungsgeschwindigkeit vor Qualität priorisieren"
SettingsWindow.PrioritizeSpeed.Summary="Tauscht bei hoher Last etwas Qualität gegen zusätzliche Kodierungsgeschwindigkeit ein."
SettingsWindow.PrioritizeSpeed.Tooltip="Apples Hardware-Encoder bevorzugen standardmäßig Qualität, selbst mit aktiviertem RealTime. Aktivieren Sie dies nur, wenn bei der gewählten Auflösung, Bitrate oder Bildrate Bilder verworfen oder verzögert werden. Die meisten Setups benötigen dies nie."
SettingsWindow.Lookahead="Eigene Lookahead-Bildanzahl"
SettingsWindow.Lookahead.Summary="Legt fest, wie viele kommende Bilder der Encoder vor der Kompression analysiert."
SettingsWindow.Lookahead.Tooltip="Ein höherer Wert kann einen Teil der durch den RealTime-Modus verlorenen Qualität zurückgewinnen, auf Kosten etwas höherer Latenz und mehr Speicher. Ein niedrigerer Wert hält die Latenz enger. Lassen Sie es ausgeschaltet, damit der Encoder automatisch entscheidet, wie OBS' nativer Encoder."
SettingsWindow.Lookahead.UnavailableTooltip="Erfordert macOS 15 (Sequoia) oder neuer. Auf diesem System nicht verfügbar."
SettingsWindow.Multitrack="Diese Encoder für Multitrack-Video verwenden"
SettingsWindow.Multitrack.Summary="Setzt diese Encoder automatisch für Multitrack-Video von Twitch, Amazon IVS und Dolby OptiView ein."
SettingsWindow.Multitrack.Tooltip="OBS ersetzt den Standard-Hardware-Encoder von Apple unmittelbar vor Streamingbeginn für jede Multitrack-Video-Spur durch den oben konfigurierten. Ist der Austausch nicht möglich, behält OBS stillschweigend den ursprünglichen Encoder bei — das Streaming wird dadurch nie blockiert."
