SettingsWindow.SectionMultitrack="Vídeo multifaixa"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mantém o codificador ao ritmo do tempo real, privilegiando latência baixa e estável."
SettingsWindow.RealTime.Tooltip="Indica ao VideoToolbox para acompanhar a taxa de fotogramas de entrada em vez de gastar tempo extra por fotograma. É isto que a Twitch, a Amazon IVS e a Dolby OptiView/Millicast esperam para o Vídeo multifaixa. Desativado, comporta-se como o codificador de hardware nativo do OBS, que pode alcançar qualidade ligeiramente melhor por bit. Recomendado: ativado para transmissão em direto, desativado para gravação local."
SettingsWindow.PrioritizeSpeed="Priorizar velocidade de codificação em detrimento da qualidade"
SettingsWindow.PrioritizeSpeed.Summary="Troca alguma qualidade por velocidade extra de codificação sob carga elevada."
SettingsWindow.PrioritizeSpeed.Tooltip="Os codificadores de hardware da Apple privilegiam a qualidade por predefinição, mesmo com o RealTime ativado. Ative isto apenas se notar fotogramas perdidos ou atrasados na resolução, taxa de bits ou taxa de fotogramas escolhida. A maioria das configurações nunca precisa disto."
SettingsWindow.Lookahead="Número personalizado de fotogramas de análise antecipada"
SettingsWindow.Lookahead.Summary="Define quantos fotogramas futuros o codificador estuda antes de comprimir."
SettingsWindow.Lookahead.Tooltip="Um valor mais alto pode recuperar parte da qualidade perdida pelo modo RealTime, à custa de um pouco mais de latência e memória. Um valor mais baixo mantém a latência mais restrita. Deixe desativado para que o codificador decida automaticamente, tal como o codificador nativo do OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Requer macOS 15 (Sequoia) ou mais recente. Não disponível neste sistema."
SettingsWindow.Multitrack="Usar estes codificadores para o Vídeo multifaixa"
SettingsWindow.Multitrack.Summary="Substitui automaticamente por estes codificadores no Vídeo multifaixa da Twitch, Amazon IVS e Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="O OBS substitui o codificador de hardware padrão da Apple pelo configurado acima para cada faixa de Vídeo multifaixa, mesmo antes de a transmissão começar. Se a substituição não for possível, o OBS mantém discretamente o codificador original — a transmissão nunca é bloqueada por isto."
