SettingsWindow.Title="macOS VideoToolbox Encoders"
SettingsWindow.SectionH264="Apple VT H264 Hardware Encoder (Customizable)"
SettingsWindow.SectionHEVC="Apple VT HEVC Hardware Encoder (Customizable)"
SettingsWindow.SectionMultitrack="Multitrack Video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Keeps the encoder in step with real time, favoring steady low latency."
SettingsWindow.RealTime.Tooltip="Tells VideoToolbox to match the incoming frame rate instead of taking extra time per frame. This is what Twitch, Amazon IVS, and Dolby OptiView/Millicast expect for Multitrack Video. Off behaves like OBS's native hardware encoder, which can reach slightly better quality per bit. Recommended: on for live streaming, off for local recording."
SettingsWindow.PrioritizeSpeed="Prioritize Encoding Speed Over Quality"
SettingsWindow.PrioritizeSpeed.Summary="Trades some quality for extra encoding speed under heavy load."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple's hardware encoders favor quality by default, even with RealTime on. Enable this only if you see dropped or delayed frames at your chosen resolution, bitrate, or frame rate. Most setups never need it."
SettingsWindow.Lookahead="Custom Lookahead Frame Count"
SettingsWindow.Lookahead.Summary="Sets how many upcoming frames the encoder studies before compressing."
SettingsWindow.Lookahead.Tooltip="A higher value can recover some quality lost to RealTime mode, at the cost of a little more latency and memory. A lower value keeps latency tighter. Leave it off to let the encoder decide automatically, same as OBS's native encoder."
SettingsWindow.Lookahead.UnavailableTooltip="Requires macOS 15 (Sequoia) or newer. Not available on this system."
SettingsWindow.Multitrack="Use these encoders for Multitrack Video"
SettingsWindow.Multitrack.Summary="Swaps these encoders in automatically for Twitch, Amazon IVS, and Dolby OptiView Multitrack Video."
SettingsWindow.Multitrack.Tooltip="OBS replaces the standard Apple hardware encoder with the one configured above for each Multitrack Video track right before streaming starts. If the swap isn't possible, OBS quietly keeps the original encoder — streaming is never blocked."
