SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Houdt de encoder gelijke tred met de realtime, met voorkeur voor stabiele lage latentie."
SettingsWindow.RealTime.Tooltip="Vertelt VideoToolbox om de inkomende framerate te volgen in plaats van extra tijd per beeld te besteden. Dit is wat Twitch, Amazon IVS en Dolby OptiView/Millicast verwachten voor Multitrack-video. Uit gedraagt het zich als de eigen hardware-encoder van OBS, die iets betere kwaliteit per bit kan bereiken. Aanbevolen: aan voor livestreaming, uit voor lokale opname."
SettingsWindow.PrioritizeSpeed="Codeersnelheid prioriteren boven kwaliteit"
SettingsWindow.PrioritizeSpeed.Summary="Ruilt wat kwaliteit in voor extra codeersnelheid bij zware belasting."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple's hardware-encoders geven standaard voorrang aan kwaliteit, zelfs met RealTime aan. Schakel dit alleen in als u verloren of vertraagde frames ziet bij de gekozen resolutie, bitrate of framerate. De meeste configuraties hebben dit nooit nodig."
SettingsWindow.Lookahead="Aangepast aantal lookahead-frames"
SettingsWindow.Lookahead.Summary="Stelt in hoeveel komende frames de encoder bestudeert voordat hij comprimeert."
SettingsWindow.Lookahead.Tooltip="Een hogere waarde kan een deel van de kwaliteit herstellen die verloren ging door de RealTime-modus, ten koste van iets meer latentie en geheugen. Een lagere waarde houdt de latentie strakker. Laat dit uit zodat de encoder automatisch beslist, net als de eigen encoder van OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Vereist macOS 15 (Sequoia) of nieuwer. Niet beschikbaar op dit systeem."
SettingsWindow.Multitrack="Gebruik deze encoders voor Multitrack-video"
SettingsWindow.Multitrack.Summary="Vervangt automatisch deze encoders voor Multitrack-video van Twitch, Amazon IVS en Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS vervangt de standaard hardware-encoder van Apple door de hierboven ingestelde encoder voor elk Multitrack-videospoor, vlak voordat het streamen begint. Als de vervanging niet mogelijk is, behoudt OBS stilletjes de oorspronkelijke encoder — streamen wordt hierdoor nooit geblokkeerd."
