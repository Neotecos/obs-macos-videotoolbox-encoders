SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Pitää enkooderin tahdissa reaaliajan kanssa suosien tasaista pientä viivettä."
SettingsWindow.RealTime.Tooltip="Käskee VideoToolboxia pysymään saapuvan kuvataajuuden tahdissa sen sijaan, että se käyttäisi ylimääräistä aikaa jokaiseen kuvaan. Juuri tätä Twitch, Amazon IVS ja Dolby OptiView/Millicast odottavat moniraitaiselta videolta. Pois päältä se toimii kuten OBS:n oma laitteistoenkooderi, joka voi saavuttaa hieman paremman laadun bittiä kohti. Suositus: päällä suoratoistossa, pois paikallisessa tallennuksessa."
SettingsWindow.PrioritizeSpeed="Priorisoi enkoodausnopeus laadun edelle"
SettingsWindow.PrioritizeSpeed.Summary="Vaihtaa hieman laatua ylimääräiseen enkoodausnopeuteen raskaan kuorman alla."
SettingsWindow.PrioritizeSpeed.Tooltip="Applen laitteistoenkooderit suosivat oletuksena laatua, vaikka RealTime olisi päällä. Ota tämä käyttöön vain, jos näet pudonneita tai viivästyneitä kuvia valitulla resoluutiolla, bittinopeudella tai kuvataajuudella. Useimmat asetukset eivät koskaan tarvitse tätä."
SettingsWindow.Lookahead="Mukautettu ennakkotarkastelukuvien määrä"
SettingsWindow.Lookahead.Summary="Määrittää, kuinka monta tulevaa kuvaa enkooderi tutkii ennen pakkausta."
SettingsWindow.Lookahead.Tooltip="Suurempi arvo voi palauttaa osan RealTime-tilan aiheuttamasta laatuhäviöstä hieman suuremman viiveen ja muistinkäytön kustannuksella. Pienempi arvo pitää viiveen tiukempana. Jätä pois päältä, jotta enkooderi päättää automaattisesti, kuten OBS:n oma enkooderi."
SettingsWindow.Lookahead.UnavailableTooltip="Vaatii macOS 15:n (Sequoia) tai uudemman. Ei saatavilla tässä järjestelmässä."
SettingsWindow.Multitrack="Käytä näitä enkoodereita moniraitaiselle videolle"
SettingsWindow.Multitrack.Summary="Vaihtaa automaattisesti näihin enkoodereihin Twitchin, Amazon IVS:n ja Dolby OptiView'n moniraitaisessa videossa."
SettingsWindow.Multitrack.Tooltip="OBS korvaa Applen vakiolaitteistoenkooderin yllä määritetyllä jokaiselle moniraitaisen videon raidalle juuri ennen suoratoiston alkua. Jos vaihto ei ole mahdollinen, OBS säilyttää hiljaisesti alkuperäisen enkooderin — tämä ei koskaan estä suoratoistoa."
