SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Održava enkoder u koraku sa stvarnim vremenom, dajući prednost stabilnoj niskoj latenciji."
SettingsWindow.RealTime.Tooltip="Govori VideoToolbox-u da prati dolaznu brzinu kadrova umesto da troši dodatno vreme po kadru. Upravo to očekuju Twitch, Amazon IVS i Dolby OptiView/Millicast za višestazni video. Isključeno se ponaša kao izvorni hardverski enkoder OBS-a, koji može postići nešto bolji kvalitet po bitu. Preporuka: uključeno za direktan prenos, isključeno za lokalno snimanje."
SettingsWindow.PrioritizeSpeed="Daj prednost brzini kodiranja u odnosu na kvalitet"
SettingsWindow.PrioritizeSpeed.Summary="Zamenjuje deo kvaliteta za dodatnu brzinu kodiranja pod velikim opterećenjem."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ovi hardverski enkoderi podrazumevano daju prednost kvalitetu, čak i uz uključen RealTime. Uključite ovo samo ako primetite izgubljene ili odložene kadrove pri izabranoj rezoluciji, protoku bitova ili brzini kadrova. Većina podešavanja to nikada ne treba."
SettingsWindow.Lookahead="Prilagođeni broj kadrova unapred pregleda"
SettingsWindow.Lookahead.Summary="Određuje koliko narednih kadrova enkoder proučava pre kompresije."
SettingsWindow.Lookahead.Tooltip="Viša vrednost može vratiti deo kvaliteta izgubljenog zbog RealTime režima, uz malo veću latenciju i memoriju. Niža vrednost održava latenciju strožom. Ostavite isključeno da bi enkoder automatski odlučivao, kao izvorni enkoder OBS-a."
SettingsWindow.Lookahead.UnavailableTooltip="Zahteva macOS 15 (Sequoia) ili noviji. Nije dostupno na ovom sistemu."
SettingsWindow.Multitrack="Koristi ove enkodere za višestazni video"
SettingsWindow.Multitrack.Summary="Automatski zamenjuje ove enkodere za višestazni video Twitch-a, Amazon IVS-a i Dolby OptiView-a."
SettingsWindow.Multitrack.Tooltip="OBS zamenjuje standardni Apple hardverski enkoder onim konfigurisanim iznad za svaku stazu višestaznog videa, neposredno pre početka emitovanja. Ako zamena nije moguća, OBS tiho zadržava originalni enkoder — emitovanje time nikada nije blokirano."
