SettingsWindow.RealTime.Summary="ຮັກສາຕົວເຂົ້າລະຫັດໃຫ້ທັນເວລາຈິງ ໂດຍໃຫ້ຄວາມສຳຄັນກັບຄວາມຫນ່ວງຕ່ຳທີ່ຫມັ້ນຄົງ."
SettingsWindow.RealTime.Tooltip="ບອກ VideoToolbox ໃຫ້ຕິດຕາມອັດຕາເຟຣມທີ່ເຂົ້າມາ ແທນທີ່ຈະໃຊ້ເວລາເພີ່ມສຳລັບແຕ່ລະເຟຣມ. ນີ້ແມ່ນສິ່ງທີ່ Twitch, Amazon IVS, ແລະ Dolby OptiView/Millicast ຄາດຫວັງສຳລັບວິດີໂອຫຼາຍແທ່ນ. ເມື່ອປິດ ມັນຈະເຮັດວຽກຄືກັບຕົວເຂົ້າລະຫັດຮາດແວດັ້ງເດີມຂອງ OBS ເຊິ່ງອາດຈະໄດ້ຄຸນນະພາບທີ່ດີກວ່າຕໍ່ບິດ. ແນະນຳ: ເປີດສຳລັບການສ່ອງສົດ, ປິດສຳລັບການບັນທຶກໃນເຄື່ອງ."
SettingsWindow.PrioritizeSpeed="ໃຫ້ຄວາມສຳຄັນຄວາມໄວການເຂົ້າລະຫັດຫຼາຍກວ່າຄຸນນະພາບ"
SettingsWindow.PrioritizeSpeed.Summary="ແລກປ່ຽນຄຸນນະພາບບາງສ່ວນເພື່ອຄວາມໄວການເຂົ້າລະຫັດເພີ່ມເຕີມພາຍໃຕ້ພາລະຫນັກ."
SettingsWindow.PrioritizeSpeed.Tooltip="ຕົວເຂົ້າລະຫັດຮາດແວຂອງ Apple ໃຫ້ຄວາມສຳຄັນກັບຄຸນນະພາບເປັນຄ່າເລີ່ມຕົ້ນ ເຖິງແມ່ນວ່າ RealTime ຈະເປີດຢູ່. ເປີດໃຊ້ນີ້ສະເພາະເມື່ອທ່ານເຫັນເຟຣມທີ່ເສຍ ຫຼື ຊັກຊ້າຢູ່ຄວາມລະອຽດ, ອັດຕາບິດ, ຫຼືອັດຕາເຟຣມທີ່ທ່ານເລືອກ. ການຕັ້ງຄ່າສ່ວນໃຫຍ່ບໍ່ຈຳເປັນຕ້ອງໃຊ້ມັນເລີຍ."
SettingsWindow.Lookahead="ຈຳນວນເຟຣມ Lookahead ແບບກຳນົດເອງ"
SettingsWindow.Lookahead.Summary="ກຳນົດວ່າຕົວເຂົ້າລະຫັດຈະສຶກສາເຟຣມທີ່ຈະມາເຖິງຈັກເຟຣມກ່ອນການບີບອັດ."
SettingsWindow.Lookahead.Tooltip="ຄ່າທີ່ສູງກວ່າສາມາດຟື້ນຟູຄຸນນະພາບບາງສ່ວນທີ່ເສຍໄປຍ້ອນໂໝດ RealTime, ແລກກັບຄວາມຫນ່ວງ ແລະ ຫນ່ວຍຄວາມຈຳທີ່ເພີ່ມຂຶ້ນເລັກນ້ອຍ. ຄ່າທີ່ຕ່ຳກວ່າຈະຮັກສາຄວາມຫນ່ວງໃຫ້ແໜ້ນກວ່າ. ປະໄວ້ໃຫ້ປິດເພື່ອໃຫ້ຕົວເຂົ້າລະຫັດຕັດສິນໃຈໂດຍອັດຕະໂນມັດ ຄືກັນກັບຕົວເຂົ້າລະຫັດດັ້ງເດີມຂອງ OBS."
SettingsWindow.Lookahead.UnavailableTooltip="ຕ້ອງການ macOS 15 (Sequoia) ຫຼືໃໝ່ກວ່າ. ບໍ່ສາມາດໃຊ້ໄດ້ໃນລະບົບນີ້."
SettingsWindow.Multitrack="ໃຊ້ຕົວເຂົ້າລະຫັດເຫຼົ່ານີ້ສຳລັບວິດີໂອຫຼາຍແທ່ນ"
SettingsWindow.Multitrack.Summary="ສະຫຼັບໄປໃຊ້ຕົວເຂົ້າລະຫັດເຫຼົ່ານີ້ໂດຍອັດຕະໂນມັດສຳລັບວິດີໂອຫຼາຍແທ່ນຂອງ Twitch, Amazon IVS, ແລະ Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS ຈະປ່ຽນຕົວເຂົ້າລະຫັດຮາດແວມາດຕະຖານຂອງ Apple ເປັນຕົວທີ່ຕັ້ງຄ່າໄວ້ຂ້າງເທິງສຳລັບແຕ່ລະແທ່ນວິດີໂອຫຼາຍແທ່ນ ກ່ອນທີ່ການສ່ອງສົດຈະເລີ່ມຕົ້ນ. ຖ້າການປ່ຽນແປງເປັນໄປບໍ່ໄດ້ OBS ຈະຮັກສາຕົວເຂົ້າລະຫັດເດີມໄວ້ຢ່າງງຽບໆ — ການສ່ອງສົດຈະບໍ່ຖືກບລັອກຍ້ອນສິ່ງນີ້ຈັກເທື່ອ."
