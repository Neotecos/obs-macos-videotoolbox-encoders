SettingsWindow.SectionMultitrack="多軌視訊"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="使編碼器與即時保持同步,優先確保穩定的低延遲。"
SettingsWindow.RealTime.Tooltip="讓 VideoToolbox 跟上輸入的畫面速率,而不是為每個畫面花費額外時間。這正是 Twitch、Amazon IVS 和 Dolby OptiView/Millicast 對多軌視訊的期望。關閉時,其行為類似於 OBS 的原生硬體編碼器,可能在每位元上獲得稍好的品質。建議:直播時開啟,本機錄製時關閉。"
SettingsWindow.PrioritizeSpeed="優先考慮編碼速度而非品質"
SettingsWindow.PrioritizeSpeed.Summary="在高負載下以部分品質換取額外的編碼速度。"
SettingsWindow.PrioritizeSpeed.Tooltip="即使開啟了 RealTime,Apple 的硬體編碼器預設仍會優先確保品質。僅當您在所選解析度、位元率或畫面速率下看到掉幀或延遲畫面時才啟用此選項。大多數設定從不需要它。"
SettingsWindow.Lookahead="自訂前瞻畫面數"
SettingsWindow.Lookahead.Summary="設定編碼器在壓縮前研究多少個即將到來的畫面。"
SettingsWindow.Lookahead.Tooltip="較高的值可以恢復一些因 RealTime 模式而損失的品質,代價是稍高的延遲和記憶體用量。較低的值可保持更緊湊的延遲。保持關閉可讓編碼器像 OBS 的原生編碼器一樣自動決定。"
SettingsWindow.Lookahead.UnavailableTooltip="需要 macOS 15 (Sequoia) 或更新版本。此系統上不可用。"
SettingsWindow.Multitrack="為多軌視訊使用這些編碼器"
SettingsWindow.Multitrack.Summary="自動替換為這些編碼器,用於 Twitch、Amazon IVS 和 Dolby OptiView 的多軌視訊。"
SettingsWindow.Multitrack.Tooltip="在直播開始前,OBS 會將每個多軌視訊軌道的標準 Apple 硬體編碼器替換為上面設定的編碼器。如果無法替換,OBS 會靜默保留原始編碼器——直播不會因此受阻。"
