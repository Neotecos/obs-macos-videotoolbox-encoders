SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Palaiko koduotoją sinchronizuotą su realiu laiku, teikiant pirmenybę stabiliai mažai delsai."
SettingsWindow.RealTime.Tooltip="Nurodo VideoToolbox atitikti gaunamų kadrų dažnį vietoj to, kad kiekvienam kadrui skirtų papildomo laiko. Būtent to iš kelių takelių vaizdo įrašo tikisi Twitch, Amazon IVS ir Dolby OptiView/Millicast. Išjungus jis veikia kaip natyvusis OBS aparatinis koduotojas, galintis pasiekti šiek tiek geresnę kokybę vienam bitui. Rekomenduojama: įjungta tiesioginėms transliacijoms, išjungta vietiniam įrašymui."
SettingsWindow.PrioritizeSpeed="Teikti pirmenybę kodavimo greičiui, o ne kokybei"
SettingsWindow.PrioritizeSpeed.Summary="Esant dideliam apkrovimui, iškeičia dalį kokybės į papildomą kodavimo greitį."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple aparatiniai koduotojai pagal numatytuosius nustatymus teikia pirmenybę kokybei, net ir įjungus RealTime. Įjunkite tai tik jei pastebite prarastus ar vėluojančius kadrus pasirinktoje raiškoje, bitų dažnyje ar kadrų dažnyje. Daugumai konfigūracijų to niekada neprireikia."
SettingsWindow.Lookahead="Pasirinktinis peržiūros iš anksto kadrų skaičius"
SettingsWindow.Lookahead.Summary="Nustato, kiek būsimų kadrų koduotojas ištiria prieš suspaudimą."
SettingsWindow.Lookahead.Tooltip="Didesnė reikšmė gali atkurti dalį kokybės, prarastos dėl RealTime režimo, tačiau kainuoja šiek tiek daugiau delsos ir atminties. Mažesnė reikšmė palaiko griežtesnę delsą. Palikite išjungtą, kad koduotojas spręstų automatiškai, kaip ir natyvusis OBS koduotojas."
SettingsWindow.Lookahead.UnavailableTooltip="Reikalauja macOS 15 (Sequoia) arba naujesnės. Šioje sistemoje nepasiekiama."
SettingsWindow.Multitrack="Naudoti šiuos koduotojus kelių takelių vaizdo įrašui"
SettingsWindow.Multitrack.Summary="Automatiškai pakeičia šiais koduotojais Twitch, Amazon IVS ir Dolby OptiView kelių takelių vaizdo įrašą."
SettingsWindow.Multitrack.Tooltip="OBS pakeičia standartinį Apple aparatinį koduotoją aukščiau sukonfigūruotu kiekvienam kelių takelių vaizdo įrašo takeliui prieš pat prasidedant transliacijai. Jei pakeitimas neįmanomas, OBS tyliai palieka originalų koduotoją — dėl to transliacija niekada neblokuojama."
