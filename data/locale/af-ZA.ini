SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Hou die enkodeerder in pas met werklike tyd, ten gunste van stabiele lae vertraging."
SettingsWindow.RealTime.Tooltip="Vertel VideoToolbox om by die inkomende raamtempo te bly in plaas daarvan om ekstra tyd per raam te neem. Dit is wat Twitch, Amazon IVS en Dolby OptiView/Millicast vir Multitrack-video verwag. Af gedra dit soos OBS se eie hardware-enkodeerder, wat effens beter kwaliteit per bis kan behaal. Aanbeveel: aan vir regstreekse uitsending, af vir plaaslike opname."
SettingsWindow.PrioritizeSpeed="Prioritiseer Enkoderingspoed bo Kwaliteit"
SettingsWindow.PrioritizeSpeed.Summary="Ruil kwaliteit in vir ekstra enkoderingspoed onder swaar las."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple se hardware-enkodeerders verkies standaard kwaliteit, selfs met RealTime aan. Aktiveer dit net as jy verlore of vertraagde raampies sien by jou gekose resolusie, bistempo of raamtempo. Die meeste opstellings het dit nooit nodig nie."
SettingsWindow.Lookahead="Pasgemaakte Vooruitkyk-raamtelling"
SettingsWindow.Lookahead.Summary="Stel hoeveel komende raampies die enkodeerder bestudeer voor saampersing."
SettingsWindow.Lookahead.Tooltip="'n Hoër waarde kan kwaliteit herwin wat deur RealTime-modus verlore gegaan het, ten koste van 'n bietjie meer vertraging en geheue. 'n Laer waarde hou vertraging strakker. Los dit af om die enkodeerder outomaties te laat besluit, soos OBS se eie enkodeerder."
SettingsWindow.Lookahead.UnavailableTooltip="Vereis macOS 15 (Sequoia) of nuwer. Nie op hierdie stelsel beskikbaar nie."
SettingsWindow.Multitrack="Gebruik hierdie enkodeerders vir Multitrack-video"
SettingsWindow.Multitrack.Summary="Vervang hierdie enkodeerders outomaties vir Twitch-, Amazon IVS- en Dolby OptiView Multitrack-video."
SettingsWindow.Multitrack.Tooltip="OBS vervang die standaard Apple-hardware-enkodeerder met dié wat hierbo opgestel is vir elke Multitrack-video-baan net voordat uitsending begin. As die verwisseling nie moontlik is nie, behou OBS stilweg die oorspronklike enkodeerder — uitsending word nooit hierdeur geblokkeer nie."
