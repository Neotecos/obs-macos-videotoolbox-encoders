SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="A kódolót valós idővel szinkronban tartja, a stabil, alacsony késleltetést előnyben részesítve."
SettingsWindow.RealTime.Tooltip="Arra utasítja a VideoToolboxot, hogy kövesse a bejövő képkockasebességet ahelyett, hogy extra időt fordítana minden képkockára. Pontosan ezt várja el a Twitch, az Amazon IVS és a Dolby OptiView/Millicast a Többsávos videótól. Kikapcsolva úgy viselkedik, mint az OBS natív hardveres kódolója, amely bitenként valamivel jobb minőséget érhet el. Javasolt: bekapcsolva élő közvetítéshez, kikapcsolva helyi felvételhez."
SettingsWindow.PrioritizeSpeed="A kódolási sebesség előnyben részesítése a minőséggel szemben"
SettingsWindow.PrioritizeSpeed.Summary="Nagy terhelés esetén némi minőséget cserél extra kódolási sebességre."
SettingsWindow.PrioritizeSpeed.Tooltip="Az Apple hardveres kódolói alapértelmezetten a minőséget részesítik előnyben, még bekapcsolt RealTime mellett is. Ezt csak akkor kapcsolja be, ha kihagyott vagy késleltetett képkockákat tapasztal a kiválasztott felbontásnál, bitrátánál vagy képkockasebességnél. A legtöbb beállításnak soha nincs rá szüksége."
SettingsWindow.Lookahead="Egyéni előretekintési képkockaszám"
SettingsWindow.Lookahead.Summary="Meghatározza, hány közelgő képkockát vizsgál meg a kódoló tömörítés előtt."
SettingsWindow.Lookahead.Tooltip="A magasabb érték visszaszerezheti a RealTime mód miatt elveszett minőség egy részét, valamivel nagyobb késleltetés és memóriahasználat árán. Az alacsonyabb érték szorosabban tartja a késleltetést. Hagyja kikapcsolva, hogy a kódoló automatikusan döntsön, akárcsak az OBS natív kódolója."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) vagy újabb szükséges. Ezen a rendszeren nem érhető el."
SettingsWindow.Multitrack="Ezen kódolók használata a Többsávos videóhoz"
SettingsWindow.Multitrack.Summary="Automatikusan ezekre a kódolókra cserél a Twitch, az Amazon IVS és a Dolby OptiView Többsávos videójánál."
SettingsWindow.Multitrack.Tooltip="Az OBS közvetlenül a közvetítés indítása előtt lecseréli a szabványos Apple hardveres kódolót a fent beállítottra minden Többsávos videó sávnál. Ha a csere nem lehetséges, az OBS csendben megtartja az eredeti kódolót — emiatt a közvetítés soha nem akad el."
