SettingsWindow.SectionMultitrack="Multitrack Video"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Pinapanatili ang encoder na sabay sa totoong oras, pinapaboran ang matatag na mababang latency."
SettingsWindow.RealTime.Tooltip="Sinasabihan ang VideoToolbox na tumugma sa dumarating na frame rate sa halip na gumugol ng dagdag na oras kada frame. Ito ang inaasahan ng Twitch, Amazon IVS, at Dolby OptiView/Millicast para sa Multitrack Video. Kapag naka-off, kumikilos ito gaya ng katutubong hardware encoder ng OBS, na maaaring makamit ang bahagyang mas magandang kalidad kada bit. Inirerekomenda: naka-on para sa live streaming, naka-off para sa lokal na pag-record."
SettingsWindow.PrioritizeSpeed="Unahin ang Bilis ng Pag-encode Kaysa sa Kalidad"
SettingsWindow.PrioritizeSpeed.Summary="Ipinagpapalit ang bahagi ng kalidad para sa dagdag na bilis ng pag-encode sa mabigat na load."
SettingsWindow.PrioritizeSpeed.Tooltip="Pinapaboran ng mga hardware encoder ng Apple ang kalidad bilang default, kahit naka-on ang RealTime. I-enable lamang ito kung may nakikita kang na-drop o na-delay na mga frame sa napiling resolution, bitrate, o frame rate. Hindi ito kailangan ng karamihan sa mga setup."
SettingsWindow.Lookahead="Custom na Bilang ng Lookahead Frame"
SettingsWindow.Lookahead.Summary="Itinatakda kung ilang paparating na frame ang sinusuri ng encoder bago mag-compress."
SettingsWindow.Lookahead.Tooltip="Ang mas mataas na halaga ay maaaring makabawi ng kalidad na nawala dahil sa RealTime mode, kapalit ng bahagyang mas mataas na latency at memorya. Ang mas mababang halaga ay nagpapanatili ng latency na mas mahigpit. Iwanan itong naka-off upang hayaan ang encoder na magpasya nang awtomatiko, tulad ng katutubong encoder ng OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Nangangailangan ng macOS 15 (Sequoia) o mas bago. Hindi available sa system na ito."
SettingsWindow.Multitrack="Gamitin ang mga encoder na ito para sa Multitrack Video"
SettingsWindow.Multitrack.Summary="Awtomatikong papalitan ng mga encoder na ito ang Multitrack Video ng Twitch, Amazon IVS, at Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="Papalitan ng OBS ang karaniwang hardware encoder ng Apple ng na-configure sa itaas para sa bawat track ng Multitrack Video, bago pa magsimula ang streaming. Kung hindi posible ang pagpapalit, tahimik na pananatilihin ng OBS ang orihinal na encoder — hindi kailanman naaantala ang streaming dahil dito."
