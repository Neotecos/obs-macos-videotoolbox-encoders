Profile="Perfil"
SettingsWindow.Title="Encodadors macOS VideoToolbox"
SettingsWindow.SectionH264="Encodador material Apple VT H264 (Personalizable)"
SettingsWindow.SectionHEVC="Encodador material Apple VT HEVC (Personalizable)"
SettingsWindow.SectionMultitrack="Vidèo multipista"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Manten l'encodador al ritme del temps real, en privilegiant una latència bassa e establa."
SettingsWindow.RealTime.Tooltip="Indica a VideoToolbox de seguir la cadéncia d'imatges entranta puslèu que de consacrar mai de temps a cada imatge. Aquò's çò qu'esperan Twitch, Amazon IVS e Dolby OptiView/Millicast per la vidèo multipista. Desactivat, se compòrta coma l'encodador material natiu d'OBS, que pòt arribar a una qualitat un pauc melhora per bit. Recomandat: activat pel dirècte, desactivat per l'enregistrament local."
SettingsWindow.PrioritizeSpeed="Prioritizar la velocitat d'encodatge sus la qualitat"
SettingsWindow.PrioritizeSpeed.Summary="Escambia una part de la qualitat contra mai de velocitat d'encodatge en cas de carga fòrta."
SettingsWindow.PrioritizeSpeed.Tooltip="Los encodadors materials d'Apple privilègian la qualitat per defaut, quitament amb RealTime activat. Activatz aquò sonque se constatatz d'imatges perduts o retardats a la resolucion, al debit o a la frequéncia d'imatges causida. La màger part de las configuracions n'an pas jamai besonh."
SettingsWindow.Lookahead="Nombre d'imatges d'anticipacion personalizat"
SettingsWindow.Lookahead.Summary="Definís lo nombre d'imatges venentas que l'encodador estúdia abans de comprimir."
SettingsWindow.Lookahead.Tooltip="Una valor mai nauta pòt recuperar una part de la qualitat perduda a causa del mòde RealTime, al prètz d'un pauc mai de latència e de memòria. Una valor mai bassa manten una latència mai estricta. Daissatz desactivat per que l'encodador decidisca automaticament, coma l'encodador natiu d'OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Necessita macOS 15 (Sequoia) o mai recent. Pas disponible sus aqueste sistèma."
SettingsWindow.Multitrack="Utilizar aquestes encodadors per la vidèo multipista"
SettingsWindow.Multitrack.Summary="Remplaça automaticament aquestes encodadors per la vidèo multipista de Twitch, Amazon IVS e Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS remplaça l'encodador material Apple estandard per aquel configurat çai-sus per cada pista de vidèo multipista, just abans lo començament de la difusion. Se lo remplaçament es pas possible, OBS garda discretament l'encodador d'origina — la difusion es pas jamai blocada per aquò."
