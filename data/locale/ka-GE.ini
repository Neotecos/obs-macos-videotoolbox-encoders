SettingsWindow.RealTime.Summary="კოდერს რეალურ დროსთან სინქრონულად ინარჩუნებს, სტაბილურ დაბალ დაყოვნებას ანიჭებს უპირატესობას."
SettingsWindow.RealTime.Tooltip="ეუბნება VideoToolbox-ს, გაჰყვეს შემომავალ კადრების სიხშირეს, ნაცვლად იმისა, რომ ყოველ კადრზე დამატებითი დრო დახარჯოს. სწორედ ამას მოელიან Twitch, Amazon IVS და Dolby OptiView/Millicast მრავალარხიანი ვიდეოსთვის. გამორთვისას ის იქცევა როგორც OBS-ის საკუთარი აპარატურული კოდერი, რომელსაც შეუძლია ოდნავ უკეთესი ხარისხის მიღწევა ბიტზე. რეკომენდებულია: ჩართული პირდაპირი ეთერისთვის, გამორთული ლოკალური ჩაწერისთვის."
SettingsWindow.PrioritizeSpeed="კოდირების სისწრაფის უპირატესობა ხარისხზე"
SettingsWindow.PrioritizeSpeed.Summary="მძიმე დატვირთვისას ხარისხის ნაწილს ცვლის დამატებით კოდირების სისწრაფეზე."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ის აპარატურული კოდერები ნაგულისხმევად ხარისხს ანიჭებენ უპირატესობას, RealTime-ის ჩართულობის მიუხედავად. ჩართეთ ეს მხოლოდ მაშინ, თუ ხედავთ დაკარგულ ან დაგვიანებულ კადრებს არჩეულ გარჩევადობაზე, ბიტრეიტზე ან კადრების სიხშირეზე. უმეტეს კონფიგურაციებს ეს არასდროს სჭირდება."
SettingsWindow.Lookahead="წინასწარი დათვალიერების კადრების მორგებული რაოდენობა"
SettingsWindow.Lookahead.Summary="განსაზღვრავს, რამდენ მომავალ კადრს სწავლობს კოდერი შეკუმშვამდე."
SettingsWindow.Lookahead.Tooltip="მაღალმა მნიშვნელობამ შეიძლება აღადგინოს RealTime რეჟიმის გამო დაკარგული ხარისხის ნაწილი, გარკვეულწილად მეტი დაყოვნებისა და მეხსიერების ხარჯზე. დაბალი მნიშვნელობა დაყოვნებას უფრო მჭიდროდ ინარჩუნებს. დატოვეთ გამორთული, რომ კოდერმა თავად, ავტომატურად გადაწყვიტოს, ისევე როგორც OBS-ის საკუთარმა კოდერმა."
SettingsWindow.Lookahead.UnavailableTooltip="საჭიროებს macOS 15-ს (Sequoia) ან უფრო ახალს. ამ სისტემაზე მიუწვდომელია."
SettingsWindow.Multitrack="გამოიყენეთ ეს კოდერები მრავალარხიანი ვიდეოსთვის"
SettingsWindow.Multitrack.Summary="ავტომატურად ანაცვლებს ამ კოდერებით Twitch-ის, Amazon IVS-ის და Dolby OptiView-ის მრავალარხიან ვიდეოს."
SettingsWindow.Multitrack.Tooltip="OBS ცვლის სტანდარტულ Apple-ის აპარატურულ კოდერს ზემოთ მორგებულით მრავალარხიანი ვიდეოს თითოეული ტრეკისთვის, ეთერის დაწყებამდე ცოტა ხნით ადრე. თუ ჩანაცვლება შეუძლებელია, OBS ჩუმად ინარჩუნებს ორიგინალურ კოდერს — ეთერი ამის გამო არასდროს ჩერდება."
