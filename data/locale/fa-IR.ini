SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="رمزگذار را هماهنگ با زمان واقعی نگه می‌دارد و تأخیر پایین و پایدار را در اولویت قرار می‌دهد."
SettingsWindow.RealTime.Tooltip="به VideoToolbox می‌گوید به‌جای صرف زمان اضافه برای هر فریم، با نرخ فریم ورودی هماهنگ باشد. این دقیقاً همان چیزی است که Twitch، Amazon IVS و Dolby OptiView/Millicast برای ویدیوی چندمسیره انتظار دارند. در حالت خاموش مانند رمزگذار سخت‌افزاری بومی OBS عمل می‌کند که می‌تواند کیفیت کمی بهتر در هر بیت به دست آورد. توصیه: روشن برای پخش زنده، خاموش برای ضبط محلی."
SettingsWindow.PrioritizeSpeed="اولویت دادن به سرعت رمزگذاری بر کیفیت"
SettingsWindow.PrioritizeSpeed.Summary="تحت بار سنگین، بخشی از کیفیت را با سرعت رمزگذاری بیشتر معاوضه می‌کند."
SettingsWindow.PrioritizeSpeed.Tooltip="رمزگذارهای سخت‌افزاری اپل به‌طور پیش‌فرض کیفیت را ترجیح می‌دهند، حتی با روشن بودن RealTime. این گزینه را تنها زمانی فعال کنید که در وضوح، بیت‌ریت یا نرخ فریم انتخابی خود فریم‌های ازدست‌رفته یا تأخیری می‌بینید. اکثر پیکربندی‌ها هرگز به آن نیاز ندارند."
SettingsWindow.Lookahead="تعداد سفارشی فریم‌های پیش‌بینی"
SettingsWindow.Lookahead.Summary="تعیین می‌کند رمزگذار پیش از فشرده‌سازی چند فریم آینده را بررسی کند."
SettingsWindow.Lookahead.Tooltip="مقدار بالاتر می‌تواند بخشی از کیفیت ازدست‌رفته به‌دلیل حالت RealTime را بازیابی کند، به قیمت کمی تأخیر و حافظه بیشتر. مقدار پایین‌تر تأخیر را فشرده‌تر نگه می‌دارد. آن را خاموش بگذارید تا رمزگذار به‌طور خودکار تصمیم بگیرد، درست مانند رمزگذار بومی OBS."
SettingsWindow.Lookahead.UnavailableTooltip="به macOS 15 (Sequoia) یا جدیدتر نیاز دارد. در این سیستم در دسترس نیست."
SettingsWindow.Multitrack="استفاده از این رمزگذارها برای ویدیوی چندمسیره"
SettingsWindow.Multitrack.Summary="به‌طور خودکار این رمزگذارها را برای ویدیوی چندمسیره Twitch، Amazon IVS و Dolby OptiView جایگزین می‌کند."
SettingsWindow.Multitrack.Tooltip="OBS درست پیش از شروع پخش، رمزگذار استاندارد سخت‌افزاری اپل را برای هر مسیر ویدیوی چندمسیره با رمزگذار پیکربندی‌شده در بالا جایگزین می‌کند. اگر جایگزینی ممکن نباشد، OBS بی‌سروصدا رمزگذار اصلی را حفظ می‌کند — پخش هرگز به‌دلیل این موضوع مسدود نمی‌شود."
