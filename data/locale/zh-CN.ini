SettingsWindow.SectionMultitrack="多轨视频"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="使编码器与实时同步,优先保证稳定的低延迟。"
SettingsWindow.RealTime.Tooltip="让 VideoToolbox 跟上输入帧率,而不是为每一帧花费额外时间。这正是 Twitch、Amazon IVS 和 Dolby OptiView/Millicast 对多轨视频的期望。关闭时,其行为类似于 OBS 的原生硬件编码器,可能在每比特上获得稍好的质量。建议:直播时开启,本地录制时关闭。"
SettingsWindow.PrioritizeSpeed="优先考虑编码速度而非质量"
SettingsWindow.PrioritizeSpeed.Summary="在高负载下用部分质量换取额外的编码速度。"
SettingsWindow.PrioritizeSpeed.Tooltip="即使开启了 RealTime,Apple 的硬件编码器默认也会优先保证质量。仅当您在所选分辨率、码率或帧率下看到丢帧或延迟帧时才启用此选项。大多数配置从不需要它。"
SettingsWindow.Lookahead="自定义前瞻帧数"
SettingsWindow.Lookahead.Summary="设置编码器在压缩前研究多少个即将到来的帧。"
SettingsWindow.Lookahead.Tooltip="较高的值可以恢复一些因 RealTime 模式而损失的质量,代价是稍高的延迟和内存占用。较低的值可保持更紧凑的延迟。保持关闭可让编码器像 OBS 的原生编码器一样自动决定。"
SettingsWindow.Lookahead.UnavailableTooltip="需要 macOS 15 (Sequoia) 或更高版本。此系统上不可用。"
SettingsWindow.Multitrack="为多轨视频使用这些编码器"
SettingsWindow.Multitrack.Summary="自动替换为这些编码器,用于 Twitch、Amazon IVS 和 Dolby OptiView 的多轨视频。"
SettingsWindow.Multitrack.Tooltip="在直播开始前,OBS 会将每个多轨视频轨道的标准 Apple 硬件编码器替换为上面配置的编码器。如果无法替换,OBS 会静默保留原始编码器——直播不会因此受阻。"
