SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Udržiava enkodér v kroku s reálnym časom, uprednostňuje stabilnú nízku latenciu."
SettingsWindow.RealTime.Tooltip="Hovorí VideoToolboxu, aby držal krok s prichádzajúcou snímkovou frekvenciou namiesto toho, aby venoval každej snímke viac času. Presne to očakávajú Twitch, Amazon IVS a Dolby OptiView/Millicast pre viacstopové video. Pri vypnutí sa správa ako natívny hardvérový enkodér OBS, ktorý môže dosiahnuť o niečo lepšiu kvalitu na bit. Odporúčanie: zapnuté pri živom vysielaní, vypnuté pri lokálnom nahrávaní."
SettingsWindow.PrioritizeSpeed="Uprednostniť rýchlosť kódovania pred kvalitou"
SettingsWindow.PrioritizeSpeed.Summary="Vymení časť kvality za vyššiu rýchlosť kódovania pri vysokom zaťažení."
SettingsWindow.PrioritizeSpeed.Tooltip="Hardvérové enkodéry Apple štandardne uprednostňujú kvalitu, aj so zapnutým RealTime. Zapnite to len ak vidíte zahodené alebo oneskorené snímky pri zvolenom rozlíšení, dátovom toku alebo snímkovej frekvencii. Väčšina konfigurácií to nikdy nepotrebuje."
SettingsWindow.Lookahead="Vlastný počet snímok dopredného náhľadu"
SettingsWindow.Lookahead.Summary="Určuje, koľko nadchádzajúcich snímok enkodér preskúma pred kompresiou."
SettingsWindow.Lookahead.Tooltip="Vyššia hodnota môže obnoviť časť kvality stratenej režimom RealTime za cenu o niečo vyššej latencie a pamäte. Nižšia hodnota drží latenciu tesnejšie. Ponechajte vypnuté, aby enkodér rozhodoval automaticky, rovnako ako natívny enkodér OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Vyžaduje macOS 15 (Sequoia) alebo novší. Na tomto systéme nie je k dispozícii."
SettingsWindow.Multitrack="Použiť tieto enkodéry pre viacstopové video"
SettingsWindow.Multitrack.Summary="Automaticky nahradí týmito enkodérmi viacstopové video pre Twitch, Amazon IVS a Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS tesne pred začiatkom vysielania nahradí štandardný hardvérový enkodér Apple enkodérom nastaveným vyššie pre každú stopu viacstopového videa. Ak výmena nie je možná, OBS ticho ponechá pôvodný enkodér — vysielanie tým nikdy nie je blokované."
