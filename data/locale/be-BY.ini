SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Утрымлівае кодар у нагу з рэальным часам, аддаючы перавагу стабільнай нізкай затрымцы."
SettingsWindow.RealTime.Tooltip="Кажа VideoToolbox прытрымлівацца хуткасці ўваходных кадраў замест таго, каб марнаваць дадатковы час на кожны кадр. Менавіта гэтага чакаюць Twitch, Amazon IVS і Dolby OptiView/Millicast для Шматдарожкавага відэа. У выключаным стане паводзіны такія ж, як у роднага апаратнага кодара OBS, які можа дасягаць крыху лепшай якасці на біт. Рэкамендуецца: уключана для прамых трансляцый, выключана для лакальнага запісу."
SettingsWindow.PrioritizeSpeed="Аддаваць перавагу хуткасці кадзіравання над якасцю"
SettingsWindow.PrioritizeSpeed.Summary="Абменьвае частку якасці на дадатковую хуткасць кадзіравання пры высокай нагрузцы."
SettingsWindow.PrioritizeSpeed.Tooltip="Апаратныя кодары Apple па змаўчанні аддаюць перавагу якасці, нават калі RealTime уключаны. Уключайце гэта толькі калі бачыце страчаныя або затрыманыя кадры пры выбраным razdzyalenni, бітрэйце ці частаце кадраў. Большасці налад гэта ніколі не спатрэбіцца."
SettingsWindow.Lookahead="Уласная колькасць кадраў апераджальнага аналізу"
SettingsWindow.Lookahead.Summary="Задае, колькі наступных кадраў кодар вывучае перад сцісканнем."
SettingsWindow.Lookahead.Tooltip="Больш высокае значэнне можа вярнуць частку якасці, страчанай з-за рэжыму RealTime, коштам крыху большай затрымкі і памяці. Меншае значэнне трымае затрымку вузейшай. Пакіньце выключаным, каб кодар вырашаў аўтаматычна, як родны кодар OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Патрабуецца macOS 15 (Sequoia) або навей. Недаступна на гэтай сістэме."
SettingsWindow.Multitrack="Выкарыстоўваць гэтыя кодары для Шматдарожкавага відэа"
SettingsWindow.Multitrack.Summary="Аўтаматычна падстаўляе гэтыя кодары для Шматдарожкавага відэа Twitch, Amazon IVS і Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS замяняе стандартны апаратны кодар Apple на настроены вышэй для кожнай дарожкі Шматдарожкавага відэа непасрэдна перад пачаткам трансляцыі. Калі замена немагчымая, OBS ціха пакідае арыгінальны кодар — трансляцыя ніколі не блакуецца з-за гэтага."
