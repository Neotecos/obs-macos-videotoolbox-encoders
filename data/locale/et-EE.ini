SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Hoiab kodeerija reaalajaga sammu, eelistades stabiilset madalat latentsust."
SettingsWindow.RealTime.Tooltip="Käseb VideoToolboxil järgida sissetulevat kaadrisagedust, selle asemel et kulutada iga kaadri peale rohkem aega. Just seda ootavad Twitch, Amazon IVS ja Dolby OptiView/Millicast mitmerajalise video puhul. Väljalülitatuna käitub see nagu OBS-i enda riistvaraline kodeerija, mis võib saavutada natuke parema kvaliteedi biti kohta. Soovitus: sisse otseülekannete jaoks, väljas kohaliku salvestuse jaoks."
SettingsWindow.PrioritizeSpeed="Eelista kodeerimiskiirust kvaliteedile"
SettingsWindow.PrioritizeSpeed.Summary="Vahetab suure koormuse korral osa kvaliteedist lisakiiruse vastu."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple'i riistvaralised kodeerijad eelistavad vaikimisi kvaliteeti, isegi kui RealTime on sees. Lülita see sisse ainult siis, kui märkad valitud eraldusvõime, bitikiiruse või kaadrisageduse juures kadunud või hilinenud kaadreid. Enamik seadistusi ei vaja seda kunagi."
SettingsWindow.Lookahead="Kohandatud ettevaatekaadrite arv"
SettingsWindow.Lookahead.Summary="Määrab, mitut eesseisvat kaadrit kodeerija enne tihendamist uurib."
SettingsWindow.Lookahead.Tooltip="Suurem väärtus võib taastada osa RealTime-režiimis kaotatud kvaliteedist, kuid nõuab veidi rohkem latentsust ja mälu. Väiksem väärtus hoiab latentsuse madalamana. Jäta väljalülitatuks, et kodeerija otsustaks automaatselt, nagu OBS-i enda kodeerija."
SettingsWindow.Lookahead.UnavailableTooltip="Nõuab macOS 15 (Sequoia) või uuemat. Selles süsteemis pole saadaval."
SettingsWindow.Multitrack="Kasuta neid kodeerijaid mitmerajalise video jaoks"
SettingsWindow.Multitrack.Summary="Vahetab automaatselt need kodeerijad Twitchi, Amazon IVS-i ja Dolby OptiView mitmerajalise video jaoks."
SettingsWindow.Multitrack.Tooltip="OBS asendab vahetult enne ülekande algust iga mitmerajalise video raja standardse Apple'i riistvaralise kodeerija ülalpool seadistatuga. Kui vahetus pole võimalik, jätab OBS vaikselt alles algse kodeerija — ülekannet see kunagi ei blokeeri."
