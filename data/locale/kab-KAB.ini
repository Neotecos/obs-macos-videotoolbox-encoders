SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Yeṭṭaf aqucay yedda akked wakud n tidet, yesnernay talwit yesbaɣuren wanda taɣwal drus."
SettingsWindow.RealTime.Tooltip="Yeqqar i VideoToolbox ad iddu d urar n tuɣac ikeccmen deg umkan n usemres n wakud nniḍen i yal tuɣact. D ayagi i ssaramen Twitch, Amazon IVS akked Dolby OptiView/Millicast i tvidyut s waṭas n tarrayin. Ma yensa, ad yili am uqucay n warrum n OBS iṣlin, i izemren ad d-yawi taɣara ifazen kra i yal abit. Ihi-d: sremeg-it i uskasi srid, sens-it i usekles adigan."
SettingsWindow.PrioritizeSpeed="Efk tazwara i tsurift n usqucci ɣef teɣara"
SettingsWindow.PrioritizeSpeed.Summary="Isbeddel kra n teɣara s tsurift-nniḍen n usqucci ma yella lḥal aẓayan."
SettingsWindow.PrioritizeSpeed.Tooltip="Iqucayen n warrum n Apple ssersen s lexṣas taɣara, ula ma yensa RealTime. Sermeg-it kan ma twalaḍ tuɣac yeṛǧan neɣ i akiḍen deg tsuffeɣt, bitrate neɣ tsurift n tuɣac i tferneḍ. Tugt n yisegmiyen ur ttḥwaǧen ara-t."
SettingsWindow.Lookahead="Amḍan n tuɣac n uwelleh yettwaseglen"
SettingsWindow.Lookahead.Summary="Isbadu acḥal n tuɣac i d-iteddun i ilemmed uqucay uqbel asqucci."
SettingsWindow.Lookahead.Tooltip="Azal ameqqran yezmer ad d-yerr kra n teɣara yeḍran s sebba n uskar RealTime, s ttawil n telqeḍ acemma ugar akked tkatut. Azal amecṭuḥ yeṭṭaf talwit tuqqes ugar. Eǧǧ-it yensa iwakken aqucay ad iɛiwed s ubrid awurman, am uqucay n OBS iṣlin."
SettingsWindow.Lookahead.UnavailableTooltip="Yesra macOS 15 (Sequoia) neɣ ijdiden. Ulac-it deg unagraw-agi."
SettingsWindow.Multitrack="Sqedec iqucayen-agi i tvidyut s waṭas n tarrayin"
SettingsWindow.Multitrack.Summary="Isbeddel s ubrid awurman iqucayen-agi i tvidyut s waṭas n tarrayin n Twitch, Amazon IVS akked Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS isbeddel aqucay n warrum n Apple aseddawi s wa yettwaseglen sennig i yal abrid n tvidyut s waṭas n tarrayin uqbel asenker n uskasi. Ma yella asbeddel ur yezmir ara, OBS yeṭṭaf s tsusmi aqucay agejdan — uskasi werǧin ad yeḥbes s sebba n waya."
