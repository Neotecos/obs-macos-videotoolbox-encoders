SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="يبقي المشفّر متزامناً مع الزمن الحقيقي، لصالح زمن استجابة منخفض وثابت."
SettingsWindow.RealTime.Tooltip="يطلب من VideoToolbox مجاراة معدل الإطارات الوارد بدلاً من أخذ وقت إضافي لكل إطار. هذا ما تتوقعه Twitch وAmazon IVS وDolby OptiView/Millicast لميزة الفيديو متعدد المسارات. عند الإيقاف يتصرف المشفّر كمشفّر Apple الأصلي في OBS، الذي قد يحقق جودة أفضل قليلاً لكل بت. يُنصح بالتفعيل للبث المباشر والإيقاف للتسجيل المحلي."
SettingsWindow.PrioritizeSpeed="إعطاء الأولوية لسرعة الترميز على الجودة"
SettingsWindow.PrioritizeSpeed.Summary="يضحي بجزء من الجودة مقابل سرعة ترميز إضافية عند الحمل الثقيل."
SettingsWindow.PrioritizeSpeed.Tooltip="تُفضّل مشفّرات Apple بالعتاد الجودة افتراضياً حتى مع تفعيل RealTime. فعّل هذا الخيار فقط إذا لاحظت إطارات مفقودة أو متأخرة عند الدقة أو معدل البت أو معدل الإطارات الذي اخترته. معظم الإعدادات لا تحتاجه إطلاقاً."
SettingsWindow.Lookahead="عدد إطارات الاستطلاع المسبق المخصص"
SettingsWindow.Lookahead.Summary="يحدد عدد الإطارات القادمة التي يدرسها المشفّر قبل الضغط."
SettingsWindow.Lookahead.Tooltip="قيمة أعلى قد تستعيد بعض الجودة المفقودة بسبب وضع RealTime، مقابل زمن استجابة وذاكرة أكبر قليلاً. القيمة الأقل تحافظ على زمن استجابة أضيق. اتركه متوقفاً ليقرر المشفّر تلقائياً، كما يفعل مشفّر OBS الأصلي."
SettingsWindow.Lookahead.UnavailableTooltip="يتطلب macOS 15 (Sequoia) أو أحدث. غير متاح على هذا النظام."
SettingsWindow.Multitrack="استخدام هذه المشفّرات لفيديو Multitrack"
SettingsWindow.Multitrack.Summary="يستبدل هذه المشفّرات تلقائياً لفيديو Multitrack الخاص بـ Twitch وAmazon IVS وDolby OptiView."
SettingsWindow.Multitrack.Tooltip="يستبدل OBS مشفّر Apple القياسي بالمشفّر المُعدّ أعلاه لكل مسار فيديو متعدد المسارات قبل بدء البث مباشرة. إذا تعذّر الاستبدال لأي سبب، يحتفظ OBS بصمت بالمشفّر الأصلي — البث لا يتوقف أبداً بسبب هذا."
