SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Kodetzailea denbora errealarekin sinkronizatuta mantentzen du, latentzia baxu eta egonkorra lehenetsiz."
SettingsWindow.RealTime.Tooltip="VideoToolboxi sarrerako fotograma-abiadurari jarraitzeko eskatzen dio, fotograma bakoitzean denbora gehiago eman beharrean. Hori da hain zuzen Twitch-ek, Amazon IVS-ek eta Dolby OptiView/Millicast-ek pista anitzeko bideorako espero dutena. Itzalita dagoenean, OBS-en berezko hardware kodetzailearen antzera jokatzen du, bit bakoitzeko kalitate hobea lor dezakeena. Gomendioa: piztuta zuzeneko emanaldietarako, itzalita tokiko grabaziorako."
SettingsWindow.PrioritizeSpeed="Lehenetsi kodeketa-abiadura kalitatearen aurretik"
SettingsWindow.PrioritizeSpeed.Summary="Kalitatea trukatzen du kodeketa-abiadura gehigarriaren truke karga handian."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ren hardware kodetzaileek lehenesten dute kalitatea berez, RealTime piztuta egon arren. Aktibatu hau soilik hautatutako bereizmenean, bit-tasan edo fotograma-abiaduran galdutako edo atzeratutako fotogramak ikusten badituzu. Konfigurazio gehienek ez dute inoiz behar."
SettingsWindow.Lookahead="Aurrerapen-fotograma kopuru pertsonalizatua"
SettingsWindow.Lookahead.Summary="Kodetzaileak konprimatu aurretik zenbat hurrengo fotograma aztertzen dituen ezartzen du."
SettingsWindow.Lookahead.Tooltip="Balio altuago batek RealTime moduak galdutako kalitatearen zati bat berreskura dezake, latentzia eta memoria pixka bat gehiagoren truke. Balio baxuago batek latentzia estuagoa mantentzen du. Utzi itzalita kodetzaileak automatikoki eraman dezan erabakia, OBS-en berezko kodetzaileak bezala."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) edo berriagoa behar da. Ez dago erabilgarri sistema honetan."
SettingsWindow.Multitrack="Erabili kodetzaile hauek pista anitzeko bideorako"
SettingsWindow.Multitrack.Summary="Automatikoki ordezkatzen ditu kodetzaile hauek Twitch, Amazon IVS eta Dolby OptiView pista anitzeko bideorako."
SettingsWindow.Multitrack.Tooltip="OBS-ek Apple-ren hardware kodetzaile estandarra goian konfiguratutakoarekin ordezkatzen du pista anitzeko bideoaren pista bakoitzeko, emanaldia hasi aurretik. Ordezkapena ezinezkoa bada, OBS-ek isilean jatorrizko kodetzailea mantentzen du — horrek ez du inoiz emanaldia blokeatzen."
