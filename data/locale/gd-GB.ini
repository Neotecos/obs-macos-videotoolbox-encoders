SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="A' cumail an t-encodair ceum air cheum ris an fhìor-àm, a' fàbharachadh gabhail-ùine ìosal cunbhalach."
SettingsWindow.RealTime.Tooltip="Ag innse dha VideoToolbox freagairt ri ìre nam frèamaichean a-steach seach barrachd ùine a chleachdadh airson gach frèam. Seo dìreach na tha Twitch, Amazon IVS, agus Dolby OptiView/Millicast an dùil ris airson video ioma-shreath. Le seo dheth, giùlainidh e mar an t-encodair bathair-cruaidh dùthchasach aig OBS, a dh'fhaodadh càileachd beagan na b' fheàrr a ruighinn gach bit. Air a mholadh: air airson sruthadh beò, dheth airson clàradh ionadail."
SettingsWindow.PrioritizeSpeed="Thoir prìomhachas do luathas encodaidh thairis air càileachd"
SettingsWindow.PrioritizeSpeed.Summary="A' malairt beagan càileachd airson barrachd luathas encodaidh fo eallach trom."
SettingsWindow.PrioritizeSpeed.Tooltip="Tha na h-encodairean bathair-cruaidh aig Apple a' fàbharachadh càileachd a ghnàth, eadhon le RealTime air. Cuir seo an comas dìreach ma chì thu frèamaichean caillte no maille aig an rùn, bitrate, no ìre frèama a thagh thu. Cha bhith feum air seo aig a' mhòr-chuid de shuidheachaidhean."
SettingsWindow.Lookahead="Àireamh frèamaichean ro-shealladh gnàthaichte"
SettingsWindow.Lookahead.Summary="A' suidheachadh cia mheud frèam a tha ri thighinn a bheir an t-encodair sùil orra mus dèan e teannachadh."
SettingsWindow.Lookahead.Tooltip="Faodaidh luach nas àirde beagan dhen chàileachd a chaidh a chall ri linn modh RealTime aiseag, air cosgais beagan a bharrachd gabhail-ùine is cuimhne. Cumaidh luach nas ìsle an gabhail-ùine nas teinne. Fàg seo dheth gus leigeil leis an encodair co-dhùnadh gu fèin-obrachail, mar an t-encodair dùthchasach aig OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Feumaidh e macOS 15 (Sequoia) no nas ùire. Chan eil e ri fhaighinn air an t-siostam seo."
SettingsWindow.Multitrack="Cleachd na h-encodairean seo airson video ioma-shreath"
SettingsWindow.Multitrack.Summary="A' cur na h-encodairean seo an àite feadhainn eile gu fèin-obrachail airson video ioma-shreath Twitch, Amazon IVS, agus Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="Cuiridh OBS an t-encodair bathair-cruaidh àbhaisteach aig Apple an àite an fhear a chaidh a rèiteachadh gu h-àrd airson gach slighe video ioma-shreath dìreach mus tòisich an sruthadh. Mura gabh an t-suidse a dhèanamh, cumaidh OBS an t-encodair tùsail gu sàmhach — cha tèid an sruthadh a bhacadh ri linn seo."
