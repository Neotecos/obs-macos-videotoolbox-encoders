SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Утримує кодувальник у такт з реальним часом, надаючи перевагу стабільно низькій затримці."
SettingsWindow.RealTime.Tooltip="Каже VideoToolbox відповідати вхідній частоті кадрів замість того, щоб витрачати додатковий час на кожен кадр. Саме цього очікують Twitch, Amazon IVS та Dolby OptiView/Millicast для багатодоріжкового відео. У вимкненому стані поводиться як нативний апаратний кодувальник OBS, який може досягти трохи кращої якості на біт. Рекомендується: увімкнено для прямих трансляцій, вимкнено для локального запису."
SettingsWindow.PrioritizeSpeed="Пріоритет швидкості кодування над якістю"
SettingsWindow.PrioritizeSpeed.Summary="Обмінює частину якості на додаткову швидкість кодування при високому навантаженні."
SettingsWindow.PrioritizeSpeed.Tooltip="Апаратні кодувальники Apple за замовчуванням надають перевагу якості, навіть з увімкненим RealTime. Вмикайте це лише якщо помічаєте втрачені або затримані кадри при обраній роздільній здатності, бітрейті чи частоті кадрів. Більшості налаштувань це ніколи не потрібно."
SettingsWindow.Lookahead="Індивідуальна кількість кадрів попереднього аналізу"
SettingsWindow.Lookahead.Summary="Визначає, скільки майбутніх кадрів кодувальник вивчає перед стисненням."
SettingsWindow.Lookahead.Tooltip="Вище значення може повернути частину якості, втраченої через режим RealTime, ціною трохи більшої затримки та пам'яті. Нижче значення утримує затримку жорсткішою. Залиште вимкненим, щоб кодувальник вирішував автоматично, як нативний кодувальник OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Потрібен macOS 15 (Sequoia) або новіший. Недоступно в цій системі."
SettingsWindow.Multitrack="Використовувати ці кодувальники для багатодоріжкового відео"
SettingsWindow.Multitrack.Summary="Автоматично підставляє ці кодувальники для багатодоріжкового відео Twitch, Amazon IVS та Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS замінює стандартний апаратний кодувальник Apple налаштованим вище для кожної доріжки багатодоріжкового відео безпосередньо перед початком трансляції. Якщо заміна неможлива, OBS тихо зберігає оригінальний кодувальник — трансляція через це ніколи не блокується."
