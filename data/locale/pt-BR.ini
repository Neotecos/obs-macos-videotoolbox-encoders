SettingsWindow.SectionMultitrack="Vídeo multifaixa"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Mantém o codificador no ritmo do tempo real, priorizando latência baixa e estável."
SettingsWindow.RealTime.Tooltip="Diz ao VideoToolbox para acompanhar a taxa de quadros de entrada em vez de gastar tempo extra por quadro. É isso que Twitch, Amazon IVS e Dolby OptiView/Millicast esperam para o Vídeo multifaixa. Desativado, ele se comporta como o codificador de hardware nativo do OBS, que pode alcançar qualidade um pouco melhor por bit. Recomendado: ativado para transmissão ao vivo, desativado para gravação local."
SettingsWindow.PrioritizeSpeed="Priorizar velocidade de codificação em vez de qualidade"
SettingsWindow.PrioritizeSpeed.Summary="Troca parte da qualidade por velocidade extra de codificação sob carga pesada."
SettingsWindow.PrioritizeSpeed.Tooltip="Os codificadores de hardware da Apple priorizam a qualidade por padrão, mesmo com o RealTime ativado. Ative isso somente se você notar quadros perdidos ou atrasados na resolução, taxa de bits ou taxa de quadros escolhida. A maioria das configurações nunca precisa disso."
SettingsWindow.Lookahead="Número personalizado de quadros de análise antecipada"
SettingsWindow.Lookahead.Summary="Define quantos quadros futuros o codificador estuda antes de comprimir."
SettingsWindow.Lookahead.Tooltip="Um valor mais alto pode recuperar parte da qualidade perdida pelo modo RealTime, ao custo de um pouco mais de latência e memória. Um valor mais baixo mantém a latência mais restrita. Deixe desativado para que o codificador decida automaticamente, assim como o codificador nativo do OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Requer macOS 15 (Sequoia) ou mais recente. Não disponível neste sistema."
SettingsWindow.Multitrack="Usar estes codificadores para Vídeo multifaixa"
SettingsWindow.Multitrack.Summary="Substitui automaticamente por estes codificadores no Vídeo multifaixa da Twitch, Amazon IVS e Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="O OBS substitui o codificador de hardware padrão da Apple pelo configurado acima para cada faixa de Vídeo multifaixa, pouco antes do início da transmissão. Se a substituição não for possível, o OBS mantém silenciosamente o codificador original — a transmissão nunca é bloqueada por isso."
