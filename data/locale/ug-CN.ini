SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="كودلىغۇچنى ھەقىقىي ۋاقىت بىلەن ماس تۇتۇپ تۇرىدۇ، تۇراقلىق تۆۋەن كېچىكىشنى ئۈستۈن كۆرىدۇ."
SettingsWindow.RealTime.Tooltip="ھەر بىر كادىرغا ئارتۇق ۋاقىت سەرپ قىلىش ئورنىغا، VideoToolbox نى كىرگۈزۈلگەن كادىر تېزلىكىگە ماسلاشتۇرۇشقا بۇيرۇيدۇ. بۇ دەل Twitch، Amazon IVS ۋە Dolby OptiView/Millicast كۆپ يولداشلىق ۋىدېئودىن ئۈمىد قىلغىنى. تاقالغاندا ئۇ OBS نىڭ ئۆزىگە خاس قاتتىق دېتال كودلىغۇچىدەك ھەرىكەت قىلىدۇ، ئۇ ھەر بىت ئۈچۈن ئازراق ياخشى سۈپەتكە ئېرىشەلەيدۇ. تەۋسىيە: تىكلا يوللاشتا ئېچىلسۇن، يەرلىك خاتىرىلەشتە تاقالسۇن."
SettingsWindow.PrioritizeSpeed="سۈپەتتىن بۇرۇن كودلاش تېزلىكىگە ئارتۇقچىلىق بېرىش"
SettingsWindow.PrioritizeSpeed.Summary="ئېغىر يۈك ئاستىدا سۈپەتنىڭ بىر قىسمىنى قوشۇمچە كودلاش تېزلىكىگە تېگىشىدۇ."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple نىڭ قاتتىق دېتال كودلىغۇچلىرى RealTime ئېچىلغان بولسىمۇ، كۆڭۈلدىكى ھالەتتە سۈپەتكە ئارتۇقچىلىق بېرىدۇ. بۇنى پەقەت تاللىغان ئېنىقلىق، بىت نىسبىتى ياكى كادىر تېزلىكىدە چۈشۈپ قالغان ياكى كېچىككەن كادىرلارنى كۆرگەندىلا ئاچىڭ. كۆپىنچە تەڭشەكلەرگە بۇ ھەرگىز كېرەك بولمايدۇ."
SettingsWindow.Lookahead="ئىختىيارى ئالدىن كۆزىتىش كادىر سانى"
SettingsWindow.Lookahead.Summary="كودلىغۇچ پرېسلاشتىن ئىلگىرى قانچە كېلىدىغان كادىرنى تەتقىق قىلىدىغانلىقىنى بەلگىلەيدۇ."
SettingsWindow.Lookahead.Tooltip="يۇقىرى قىممەت RealTime ھالىتى تۈپەيلىدىن يوقالغان سۈپەتنىڭ بىر قىسمىنى قايتۇرۇپ كېلەلەيدۇ، بۇنىڭ ئۈچۈن ئازراق كۆپرەك كېچىكىش ۋە ئەسلەك كېرەك بولىدۇ. تۆۋەن قىممەت كېچىكىشنى تېخىمۇ چىڭ تۇتىدۇ. كودلىغۇچنىڭ ئۆزلۈكىدىن قارار قىلىشى ئۈچۈن تاقاق قالدۇرۇڭ، OBS نىڭ ئۆزىگە خاس كودلىغۇچىدەك."
SettingsWindow.Lookahead.UnavailableTooltip="macOS 15 (Sequoia) ياكى تېخىمۇ يېڭىسى تەلەپ قىلىنىدۇ. بۇ سىستېمىدا ئىشلىتىلمەيدۇ."
SettingsWindow.Multitrack="كۆپ يولداشلىق ۋىدېئو ئۈچۈن بۇ كودلىغۇچلارنى ئىشلىتىش"
SettingsWindow.Multitrack.Summary="Twitch، Amazon IVS ۋە Dolby OptiView كۆپ يولداشلىق ۋىدېئوسى ئۈچۈن بۇ كودلىغۇچلارنى ئاپتوماتىك ئالماشتۇرىدۇ."
SettingsWindow.Multitrack.Tooltip="يوللاش باشلىنىشتىن ئىلگىرى، OBS ھەر بىر كۆپ يولداشلىق ۋىدېئو يولى ئۈچۈن ئۆلچەملىك Apple قاتتىق دېتال كودلىغۇچىنى يۇقىرىدا تەڭشەلگىنى بىلەن ئالماشتۇرىدۇ. ئالماشتۇرۇش مۇمكىن بولمىسا، OBS جىمجىت ھالدا ئەسلى كودلىغۇچنى ساقلاپ قالىدۇ — يوللاش بۇنىڭ تۈپەيلىدىن ھەرگىز توسۇلمايدۇ."
