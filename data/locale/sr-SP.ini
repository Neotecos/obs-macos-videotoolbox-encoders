SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Одржава енкодер у кораку са стварним временом, дајући предност стабилној ниској латенцији."
SettingsWindow.RealTime.Tooltip="Говори VideoToolbox-у да прати долазну брзину кадрова уместо да троши додатно време по кадру. Управо то очекују Twitch, Amazon IVS и Dolby OptiView/Millicast за вишестазни видео. Искључено се понаша као изворни хардверски енкодер OBS-а, који може постићи нешто бољи квалитет по биту. Препорука: укључено за директан пренос, искључено за локално снимање."
SettingsWindow.PrioritizeSpeed="Дај предност брзини кодирања у односу на квалитет"
SettingsWindow.PrioritizeSpeed.Summary="Замењује део квалитета за додатну брзину кодирања под великим оптерећењем."
SettingsWindow.PrioritizeSpeed.Tooltip="Apple-ови хардверски енкодери подразумевано дају предност квалитету, чак и уз укључен RealTime. Укључите ово само ако приметите изгубљене или одложене кадрове при изабраној резолуцији, протоку битова или брзини кадрова. Већина подешавања то никада не треба."
SettingsWindow.Lookahead="Прилагођени број кадрова унапред прегледа"
SettingsWindow.Lookahead.Summary="Одређује колико наредних кадрова енкодер проучава пре компресије."
SettingsWindow.Lookahead.Tooltip="Виша вредност може вратити део квалитета изгубљеног због RealTime режима, уз мало већу латенцију и меморију. Нижа вредност одржава латенцију строжом. Оставите искључено да би енкодер аутоматски одлучивао, као изворни енкодер OBS-а."
SettingsWindow.Lookahead.UnavailableTooltip="Захтева macOS 15 (Sequoia) или новији. Није доступно на овом систему."
SettingsWindow.Multitrack="Користи ове енкодере за вишестазни видео"
SettingsWindow.Multitrack.Summary="Аутоматски замењује ове енкодере за вишестазни видео Twitch-а, Amazon IVS-а и Dolby OptiView-а."
SettingsWindow.Multitrack.Tooltip="OBS замењује стандардни Apple хардверски енкодер оним конфигурисаним изнад за сваку стазу вишестазног видеа, непосредно пре почетка емитовања. Ако замена није могућа, OBS тихо задржава оригинални енкодер — емитовање тиме никада није блокирано."
