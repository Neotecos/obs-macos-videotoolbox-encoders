SettingsWindow.SectionMultitrack="Video Multitrack"
SettingsWindow.RealTime="RealTime"
SettingsWindow.RealTime.Summary="Menjaga encoder selaras dengan waktu nyata, mengutamakan latensi rendah yang stabil."
SettingsWindow.RealTime.Tooltip="Memberi tahu VideoToolbox untuk mengikuti frame rate yang masuk alih-alih menghabiskan waktu ekstra per frame. Inilah yang diharapkan Twitch, Amazon IVS, dan Dolby OptiView/Millicast untuk Video Multitrack. Saat dimatikan, perilakunya seperti encoder perangkat keras asli OBS, yang dapat mencapai kualitas sedikit lebih baik per bit. Disarankan: aktif untuk siaran langsung, nonaktif untuk perekaman lokal."
SettingsWindow.PrioritizeSpeed="Utamakan Kecepatan Encoding daripada Kualitas"
SettingsWindow.PrioritizeSpeed.Summary="Menukar sebagian kualitas dengan kecepatan encoding ekstra saat beban berat."
SettingsWindow.PrioritizeSpeed.Tooltip="Encoder perangkat keras Apple secara default mengutamakan kualitas, bahkan dengan RealTime aktif. Aktifkan ini hanya jika Anda melihat frame yang terlewat atau tertunda pada resolusi, bitrate, atau frame rate yang dipilih. Sebagian besar pengaturan tidak pernah membutuhkannya."
SettingsWindow.Lookahead="Jumlah Frame Lookahead Kustom"
SettingsWindow.Lookahead.Summary="Menentukan berapa banyak frame mendatang yang dipelajari encoder sebelum mengompresi."
SettingsWindow.Lookahead.Tooltip="Nilai yang lebih tinggi dapat memulihkan sebagian kualitas yang hilang akibat mode RealTime, dengan biaya sedikit lebih banyak latensi dan memori. Nilai yang lebih rendah menjaga latensi lebih ketat. Biarkan nonaktif agar encoder memutuskan secara otomatis, sama seperti encoder asli OBS."
SettingsWindow.Lookahead.UnavailableTooltip="Memerlukan macOS 15 (Sequoia) atau lebih baru. Tidak tersedia di sistem ini."
SettingsWindow.Multitrack="Gunakan encoder ini untuk Video Multitrack"
SettingsWindow.Multitrack.Summary="Secara otomatis mengganti dengan encoder ini untuk Video Multitrack Twitch, Amazon IVS, dan Dolby OptiView."
SettingsWindow.Multitrack.Tooltip="OBS mengganti encoder perangkat keras Apple standar dengan yang dikonfigurasi di atas untuk setiap trek Video Multitrack tepat sebelum streaming dimulai. Jika penggantian tidak memungkinkan, OBS diam-diam mempertahankan encoder asli — streaming tidak akan pernah terhambat karenanya."
